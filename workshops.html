<style>
/* ==========================================================
   十二场 · 同时段对照，不是一条任务清单

@font-face{font-family:"Orbitron";src:url("assets/orbitron-500.woff2") format("woff2");font-weight:400 600;font-display:block}
@font-face{font-family:"Orbitron";src:url("assets/orbitron-700.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Orbitron";src:url("assets/orbitron-900.woff2") format("woff2");font-weight:800 900;font-display:block}
:root{
  --ink:#04030A;--violet:#3B227B;--violet-l:#6B4EC4;
  --gold:#C79B6E;--gold-l:#F0D6B6;--gold-hi:#FFD9A8;

  --font-cn:"PingFang SC","Hiragino Sans GB","Heiti SC","Noto Sans SC","Microsoft YaHei",sans-serif;

  --pad:18px;--bar:52px;
}
@media (min-width:390px){:root{--pad:20px}}
@media (min-width:768px){:root{--pad:28px}}
*,*::before,*::after{box-sizing:border-box}
html{background:#D79580;color-scheme:dark;-webkit-text-size-adjust:100%;scroll-padding-top:72px;scroll-padding-bottom:160px;overscroll-behavior-x:none}
html,body{margin:0;padding:0}
body{background:#D79580;color:var(--ink);font-family:var(--font-cn);-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
::selection{background:rgba(199,155,110,.35);color:#fff}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#D79580}
.floor{position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:0;pointer-events:none;overflow:hidden;perspective:760px;perspective-origin:50% 0%;-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 78%);mask-image:linear-gradient(to top,#000 0%,transparent 78%)}
.floor i{position:absolute;left:-70%;right:-70%;top:0;bottom:0;transform-origin:50% 100%;transform:rotateX(68deg);opacity:.22;background-image:linear-gradient(rgba(159,211,236,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(159,211,236,.35) 1px,transparent 1px);background-size:96px 96px}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.2;background:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.frame{position:fixed;inset:0;z-index:4;pointer-events:none}

.frame__c--tr{top:8px;right:8px;border-left:0;border-bottom:0}
.frame__c--bl{bottom:8px;left:8px;border-right:0;border-top:0}
.frame__c--br{bottom:8px;right:8px;border-left:0;border-top:0}
.rail{display:none}
@media (min-width:1180px){

.brand{

  padding:env(safe-area-inset-top,0px) max(8px,calc((100% - var(--col)) / 2)) 0 max(var(--pad),calc((100% - var(--col)) / 2 + var(--pad)));

}
@media (min-width:800px){.brand{--col:980px}}
.brand__id{flex:1;min-width:0;display:flex;align-items:center;gap:8px;margin:0;font-family:var(--font-led);font-weight:700;font-size:9px;letter-spacing:.12em;white-space:nowrap;color:var(--ink)}
.brand__id i{font-style:normal;font-size:15px;line-height:1;color:var(--ink);text-shadow:none}
.toc-btn{

  border:0;background:transparent;color:var(--ink);

}
.toc-btn:focus-visible,.chan a:focus-visible,.hold:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.toc-btn:active,.toc-btn[aria-expanded="true"]{color:var(--ink)}
@media (max-width:340px){.brand__id{letter-spacing:.08em}}
/* 手机上顶栏跟着页走。点某一场之后，说明和顶栏滚出视口，数字条才能贴在屏幕顶。 */
@media (max-width:899px){
  .brand{position:relative;top:auto}
}
.head{padding:16px 0 0}
.head__k{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:var(--font-led);font-size:9px;letter-spacing:.22em;color:var(--ink)}
.head__k::before{content:"";width:22px;height:1px;flex:none;background:linear-gradient(90deg,var(--ice),transparent)}
.head__t{margin:0;font-size:32px;font-weight:700;line-height:1.25;letter-spacing:.02em;white-space:nowrap;text-wrap:pretty;background:linear-gradient(178deg,#4A3010 6%,#3E280C 42%,#32210A 72%,#2A1A0C 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#3E280C}
.lock{display:flex;align-items:baseline;gap:8px;margin:12px 0 0;font-family:var(--font-led);font-weight:700;font-size:32px;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#3E280C;line-height:1}
.lock span{font-family:var(--font-cn);font-size:14px;font-weight:600;letter-spacing:.08em;color:#0A303C}
@media (max-width:360px){.head__t{font-size:28px}.lock{font-size:26px}.head__k{letter-spacing:.12em}}
.sec{margin-top:8px}
.sec__k{margin:14px 0 8px;font-family:var(--font-led),var(--font-cn);font-size:12px;letter-spacing:.14em;color:#3E280C}
.sec__t{margin:0 0 8px;font-size:22px;font-weight:700;line-height:1.35;color:var(--ink)}
.rule{margin:0 0 8px;font-size:15px;line-height:1.7;color:var(--ink)}
.pending{margin:0 0 12px;font-size:14px;line-height:1.6;color:#3E280C}
.sec__t{text-wrap:pretty}
#rooms{scroll-margin-top:12px;scroll-margin-bottom:110px}
.card{scroll-margin-top:72px;scroll-margin-bottom:110px}
fieldset{border:0;margin:0;padding:0;min-width:0}
/* ---------- 场次跳转：自己横滑，不撑开页面 ---------- */
.chan{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar));z-index:24;
  display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;
  margin:0 calc(var(--pad) * -1);padding:8px var(--pad) 8px;
  background:#D79580;border-bottom:1px solid rgba(199,155,110,.16);
  scrollbar-color:rgba(199,155,110,.45) transparent;
}
@media (max-width:720px){
  .chan{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
}
.chan a{
  flex:none;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-led);font-size:12px;font-weight:700;letter-spacing:.04em;text-decoration:none;
  color:#3E280C;border:1px solid rgba(199,155,110,.4);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.chan a:active{background:rgba(199,155,110,.16)}
.chan a[aria-current="true"]{border-color:var(--gold-l);background:rgba(199,155,110,.22);color:#3E280C}
@media (max-width:899px){.chan{top:0}}
/* ---------- 十二场：封面流。中间最大，两侧透视立起，像在翻专辑 ---------- */
.deck{
  display:flex;align-items:stretch;
  margin:8px 8px 0;padding:8px 0 18px;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scroll-padding-inline:0;
  overscroll-behavior-x:contain;
  scrollbar-width:none;
  touch-action:manipulation;
  /* 透视写在每张卡的 transform 里。滚动容器的 overflow 会把祖先 perspective 压平。 */
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.deck::-webkit-scrollbar{display:none;height:0}
.card{
  flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:normal;
  position:relative;z-index:0;display:flex;justify-content:center;
  min-width:0;min-height:44px;padding:4px 0 10px;
  align-items:center;
  background:transparent;border:0;box-shadow:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.card__face{
  width:min(78%,440px);min-width:0;height:calc(100% - 36px);
  display:flex;flex-direction:column;gap:8px;
  padding:16px 16px 14px;border-radius:30px;
  border:1px solid rgba(92,44,32,.16);
  background:linear-gradient(180deg,#FFF9F5 0%,#FFF1E8 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 10px 22px rgba(112,44,32,.16),
    0 26px 46px rgba(78,28,20,.14);
  transform:perspective(760px) translate3d(var(--tx,0px),0,var(--tz,0px)) rotateY(var(--ry,0deg)) scale(var(--sc,1));
  transform-origin:center center;
  position:relative;
}
.card__face::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:#6A3428;opacity:var(--veil,0);
}
.card input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;pointer-events:none}
.card:focus-within .card__face{outline:2px solid var(--ice);outline-offset:3px}
.card.is-on .card__face,.card:has(input:checked) .card__face{
  border-color:#3E280C;
  background:linear-gradient(180deg,#FFF8F2 0%,#F8E6D8 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.92),
    0 12px 26px rgba(112,44,32,.2),
    0 30px 52px rgba(78,28,20,.18);
}
.card__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card__top b{font-family:var(--font-led);font-size:15px;font-weight:700;letter-spacing:.06em;color:#3E280C}
.card__flag{display:none;font-size:12px;font-weight:700;letter-spacing:.08em;color:#3E280C}
.card.is-on .card__flag,.card:has(input:checked) .card__flag{display:inline}
.card__sq{width:14px;height:14px;border:1px solid rgba(240,214,182,.8);flex:none}
.card.is-on .card__sq,.card:has(input:checked) .card__sq{background:var(--gold-l);box-shadow:inset 0 0 0 3px #201614}
.card__top .card__end{display:flex;align-items:center;gap:8px}
.card__name{font-size:16px;font-weight:700;line-height:1.45;text-wrap:pretty;color:var(--ink)}
.card__who{font-size:14px;line-height:1.4;color:#3E280C}
/* 外框高度固定为一屏：数字条贴顶到报名按钮之间。说明在不在视口里都不改这个高度。
   字装不下时只滚卡内，地点和名额留在框底，不靠改外框来腾地方。 */
.card__body{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;
  overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(199,155,110,.45) transparent;
}
@media (max-width:899px){
  .deck{margin:10px 10px 0;padding:6px 0 14px}
  .card{height:var(--card-h,auto);min-height:0}
  .card__meta{margin-top:0}
}
@media (max-width:340px) and (max-height:580px){
  :root{--bar:44px}
  .wrap{padding-top:6px}
  .head{padding-top:2px}
  .head__k{margin-bottom:2px}
  .head__t{font-size:24px;line-height:1.15}
  .lock{margin-top:2px;font-size:22px}
  .sec{margin-top:2px}
  .sec__k{margin:4px 0 2px}
  .sec__t{font-size:18px;margin-bottom:2px}
  .rule,.pending{font-size:13px;line-height:1.35;margin-bottom:4px}
}
@media (min-width:900px){
  .card{height:auto;min-height:420px}
  .card__face{height:auto;min-height:384px}
}
.card__meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:4px;font-size:13px;color:#0A303C}
.card__meta b{margin-left:6px;font-weight:700;color:var(--ink)}
/* ---------- 底栏：未接通，不是金砖 ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 var(--pad) calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;background:#D79580}
.dock__in{max-width:720px;margin:0 auto;pointer-events:auto;padding-top:8px;background:#D79580}
@media (min-width:800px){.dock__in{max-width:980px}}
@media (min-width:900px){
  body{padding-bottom:0}
  .dock{position:static;pointer-events:auto;background:none;padding:22px var(--pad) 36px}
  .dock__in{background:none;padding-top:0}
  .dock .hold{max-width:440px}
}
@media (hover:hover) and (pointer:fine){
  .toc-btn:hover{color:var(--ink)}
  .card:hover .card__face{border-color:#3E280C}
  .chan a:hover{border-color:var(--gold-l);color:#3E280C}
}
@media (max-height:700px){
  .head{padding-top:6px}
  .head__k{margin-bottom:6px}
  .lock{margin-top:4px;font-size:26px}
  .sec__k{margin:8px 0 4px}
  .sec__t{margin-bottom:4px}
  .rule,.pending{margin-bottom:6px}
  .chan{padding-top:4px;padding-bottom:4px}
}
.hold{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:0 14px;
  border:1px solid rgba(199,155,110,.6);background:rgba(32,22,20,.9);color:var(--gold-l);
  font-family:var(--font-cn);font-size:15px;font-weight:700;letter-spacing:.06em;

.hold:disabled,.hold[aria-disabled="true"]{color:var(--gold-l);opacity:1}
.in{opacity:0;transform:translateY(12px);animation:bootIn .8s cubic-bezier(.22,1,.36,1) forwards}
.in1{animation-delay:.08s}.in2{animation-delay:.16s}.in3{animation-delay:.26s}.in4{animation-delay:.36s}
@keyframes bootIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .in{opacity:1;transform:none}
}
@media (forced-colors:active){
  .head__t{background:none;-webkit-text-fill-color:CanvasText;color:CanvasText}
  .card__face,.hold,.chan a{border:1px solid ButtonText}
  .toc-btn,.toc__panel{background:Canvas;color:CanvasText;border:1px solid CanvasText}
}
/* ---------- 右侧目录：右上角「目录」打开。收起时整段移出，不留把手。 ---------- */
.toc{
  position:fixed;z-index:32;
  top:calc(env(safe-area-inset-top,0px) + var(--bar) + 8px);
  bottom:calc(120px + env(safe-area-inset-bottom,0px));
  right:env(safe-area-inset-right,0px);
  width:min(196px,calc(100% - 162px));
  transform:translateX(calc(100% + 16px));
  transition:transform .28s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}
.toc.is-open{transform:none}
.toc__panel{
  pointer-events:auto;position:absolute;left:0;top:0;right:0;bottom:0;overflow:auto;
  overscroll-behavior:contain;padding:14px 12px 12px 8px;background:#D79580;
  border-left:1px solid rgba(199,155,110,.45);
}
.toc.is-open .toc__panel{box-shadow:-14px 0 24px rgba(4,3,10,.5)}
.toc__k{margin:0 4px 8px;font-family:var(--font-led);font-size:9px;letter-spacing:.22em;color:var(--ink)}
.toc a{
  display:flex;align-items:center;min-height:44px;padding:0 8px;
  color:var(--ink);text-decoration:none;font-size:15px;font-weight:700;
  border-top:1px solid rgba(199,155,110,.16);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.toc a[aria-current="page"]{color:var(--ink);background:rgba(199,155,110,.1);box-shadow:inset 2px 0 0 var(--gold-hi)}

@media (hover:hover) and (pointer:fine){
  .toc a:hover{color:var(--ink)}
}
</style>

<body>

<div class="bg" aria-hidden="true"></div>
<div class="floor" aria-hidden="true"><i></i></div>
<div class="scan" aria-hidden="true"></div>

  <span class="frame__line"></span>
  <span class="frame__c frame__c--tl"></span>
  <span class="frame__c frame__c--tr"></span>

  <span class="frame__c frame__c--br"></span>
</div>
<span class="rail rail--l" aria-hidden="true">11:35–12:35 · 十二选一</span>

<a class="skip-link" href="#main">跳到正文</a>

  <p class="brand__id"><i aria-hidden="true">∞</i><span translate="no">TRY AND ALL IS POSSIBLE</span></p>
  <button type="button" class="toc-btn" id="toc-btn" aria-expanded="false" aria-controls="toc-panel">目录</button>
</header>
<main class="wrap" id="main">
  <header class="head">
    <p class="head__k in in1">SIDE QUESTS</p>
    <h1 class="head__t in in2">十二场工作坊</h1>
    <p class="lock in in3"><b>11:35</b><span>至</span><b>12:35</b></p>
  </header>

  <section class="sec" id="rooms">
    <p class="sec__k in in4">01 · 提前报名</p>
    <h2 class="sec__t">同一时间，十二场</h2>
    <fieldset aria-label="十二场里先点一场。选中不会送出。">
      <p class="rule">同一时间只能去一场。嘉宾提前报名，报满即止。地点和名额之后补充。</p>
      <p class="pending" id="pick-note" aria-live="polite">可以先点一场。选中只留在这台手机上，还不能提交。</p>
      <nav class="chan" aria-label="按场次跳转">
        <a href="#w01">01</a><a href="#w02">02</a><a href="#w03">03</a><a href="#w04">04</a>
        <a href="#w05">05</a><a href="#w06">06</a><a href="#w07">07</a><a href="#w08">08</a>
        <a href="#w09">09</a><a href="#w10">10</a><a href="#w11">11</a><a href="#w12">12</a>
      </nav>
      <div class="deck" id="deck" aria-label="十二场工作坊，左右滑动换场">

<script>
(function(){
'use strict';
/* 选中只改这台手机上的句子，不提交、不记到本地 */
var note = document.getElementById('pick-note');
var cards = document.querySelectorAll('.card');
function paint(){
  cards.forEach(function(c){
    c.classList.toggle('is-on', c.querySelector('input').checked);
  });
}
cards.forEach(function(c){
  c.querySelector('input').addEventListener('change', function(){
    paint();
    note.textContent = c.querySelector('.card__top b').textContent + ' 这场已记在这台手机上，还不能提交。';
  });
});
document.querySelectorAll('.hold').forEach(function(b){

<script>
(function(){
'use strict';
/* 右上角「目录」打开这一层。收起时链接不进 Tab 序。右缘不留把手，也不再靠左滑打开。 */
var root = document.getElementById('toc');
var btn = document.getElementById('toc-btn');
var panel = document.getElementById('toc-panel');
var open = false;
function setOpen(next){
  open = next;
  root.classList.toggle('is-open', open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  panel.inert = !open;
}
btn.addEventListener('click', function(){ setOpen(!open); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && open){ setOpen(false); btn.focus(); }
});
panel.addEventListener('click', function(e){
  var a = e.target.closest('a');
  if (!a) return;
  if ((a.getAttribute('href') || '').charAt(0) === '#') setOpen(false);
});
var sx = 0, sy = 0, armed = false, pid = null;
document.addEventListener('pointerdown', function(e){
  if (!open) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (!panel.contains(e.target)) return;
  armed = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY;
});
document.addEventListener('pointerup', function(e){
  if (!armed || e.pointerId !== pid) return;
  armed = false;
  var dx = e.clientX - sx, dy = e.clientY - sy;
  if (dx < 48 || Math.abs(dx) < Math.abs(dy)) return;
  setOpen(false);
});
document.addEventListener('pointercancel', function(){ armed = false; });
})();
</script>
<script>
(function(){
'use strict';
/* 数字条和卡片是两条独立的横滑。点数字才跳场，并让说明滚出视口。 */
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var deck = document.getElementById('deck');
var chan = document.querySelector('.chan');
if (!deck || !chan) return;
var links = Array.prototype.slice.call(chan.querySelectorAll('a'));
var cards = Array.prototype.slice.call(deck.querySelectorAll('.card'));
var current = -1;
var raf = 0;

function motion(){ return reduce ? 'auto' : 'smooth'; }

function indexFromScroll(){
  var mid = deck.scrollLeft + deck.clientWidth / 2;
  var best = 0, bestD = Infinity;
  for (var i = 0; i < cards.length; i++){
    var c = cards[i].offsetLeft + cards[i].offsetWidth / 2;
    var d = Math.abs(c - mid);
    if (d < bestD){ bestD = d; best = i; }
  }
  return best;
}

/* 封面流：滚动位置直接驱动旋转和远近，不另加过渡，手指到哪封面跟到哪。 */
function placeCover(){
  var viewW = deck.clientWidth;
  if (!viewW) return;
  if (deck._slotW !== viewW) {
    deck._slotW = viewW;
    for (var s = 0; s < cards.length; s++) cards[s].style.flexBasis = viewW + 'px';
  }
  var scroll = deck.scrollLeft;
  var peek = Math.max(44, Math.min(64, viewW * 0.15));
  var reads = [];
  for (var i = 0; i < cards.length; i++){
    var slot = cards[i].offsetWidth;
    var face = cards[i].querySelector('.card__face');
    var faceW = face ? face.offsetWidth : slot;
    var natural = cards[i].offsetLeft + slot / 2 - scroll;
    reads.push({i:i, face:face, faceW:faceW, natural:natural, t:(natural - viewW / 2) / viewW});
  }
  for (var k = 0; k < reads.length; k++){
    var m = reads[k];
    if (!m.face) continue;
    var t = m.t;
    var a = Math.abs(t);
    var s = t < 0 ? -1 : 1;
    /* 停稳时正对观众。只有正在翻的那一张和紧邻的一张被拉进画面。 */
    var settled = a < 0.14;
    var scale = settled ? 1 : 1 - Math.min(a, 1) * 0.11;
    if (scale < 0.82) scale = 0.82;
    var tx = 0;
    if (!settled && a < 1.4) {
      var half = m.faceW * scale / 2;
      var along = Math.min(a, 1);
      var rest = viewW / 2 - peek + half;
      var target = viewW / 2 + s * along * rest;
      var pull = a <= 1 ? 1 : Math.max(0, 1 - (a - 1) / 0.4);
      tx = (target - m.natural) * pull;
    }
    var spin = reduce ? 14 : 40;
    var ry = settled ? 0 : s * Math.min(a, 1) * spin;
    var tz = (settled ? 1 : 1 - Math.min(a, 1)) * (reduce ? 0 : 36);
    var veil = settled ? 0 : Math.min(0.14, Math.max(0, a - 0.12) * 0.12);
    m.face.style.setProperty('--tx', tx.toFixed(2) + 'px');
    m.face.style.setProperty('--ry', ry.toFixed(2) + 'deg');
    m.face.style.setProperty('--tz', tz.toFixed(1) + 'px');
    m.face.style.setProperty('--sc', scale.toFixed(3));
    m.face.style.setProperty('--veil', veil.toFixed(3));
    cards[m.i].style.zIndex = String(80 - Math.round(Math.min(a, 4) * 14));
  }
}

function centerLink(i, smooth){
  var a = links[i];
  if (!a) return;
  var c = chan.getBoundingClientRect();
  var r = a.getBoundingClientRect();
  var delta = (r.left + r.width / 2) - (c.left + c.width / 2);
  if (Math.abs(delta) < 2) return;
  chan.scrollTo({left: chan.scrollLeft + delta, behavior: smooth ? motion() : 'auto'});
}

function setCurrent(i, reveal){
  if (i < 0 || i >= links.length || i === current) {
    if (reveal && i === current) centerLink(i, false);
    return;
  }
  current = i;
  for (var n = 0; n < links.length; n++){
    if (n === i) links[n].setAttribute('aria-current', 'true');
    else links[n].removeAttribute('aria-current');
  }
  if (reveal) centerLink(i, false);
}

function deckLeftFor(i){
  return cards[i].offsetLeft - cards[0].offsetLeft;
}

function scrollDeckTo(i, smooth){
  deck.scrollTo({left: deckLeftFor(i), behavior: smooth ? motion() : 'auto'});
}

function stageHeight(){
  /* 数字条和报名按钮之间留一圈空隙，卡片不要贴满这一截。 */
  var chanH = chan.getBoundingClientRect().height;
  var holdTop = document.querySelector('.hold').getBoundingClientRect().top;
  return Math.floor(holdTop - chanH - 28);
}
function fitCards(){
  if (window.innerWidth >= 900){
    document.documentElement.style.removeProperty('--card-h');
    return;
  }
  var h = stageHeight();
  if (h < 160) h = 160;
  document.documentElement.style.setProperty('--card-h', h + 'px');
}
window.addEventListener('resize', function(){ fitCards(); placeCover(); });
fitCards();
placeCover();

function scrollPageToStage(){
  if (window.innerWidth >= 900){
    var top = deck.getBoundingClientRect().top;
    if (top < 72 || deck.getBoundingClientRect().bottom > window.innerHeight - 24){
      window.scrollTo({top: deck.getBoundingClientRect().top + window.scrollY - 76, behavior: motion()});
    }
    return;
  }
  var y = chan.getBoundingClientRect().top + window.scrollY;
  window.scrollTo({top: y, behavior: motion()});
}

links.forEach(function(a, i){
  a.addEventListener('click', function(e){
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    setCurrent(i, true);
    centerLink(i, true);
    scrollDeckTo(i, true);
    scrollPageToStage();
    if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
  });
});

deck.addEventListener('scroll', function(){
  if (raf) return;
  raf = requestAnimationFrame(function(){
    raf = 0;
    placeCover();
    setCurrent(indexFromScroll(), true);
  });
}, {passive:true});

deck.addEventListener('scrollend', function(){
  placeCover();
  var i = indexFromScroll();
  setCurrent(i, true);
  if (history.replaceState) history.replaceState(null, '', links[i].getAttribute('href'));
});

cards.forEach(function(c, i){
  c.querySelector('input').addEventListener('change', function(){
    if (!this.checked) return;
    setCurrent(i, true);
    if (Math.abs(deck.scrollLeft - deckLeftFor(i)) > 4) scrollDeckTo(i, true);
  });
});

var hashed = links.findIndex(function(a){ return a.getAttribute('href') === location.hash; });
setCurrent(hashed >= 0 ? hashed : 0, hashed >= 0);
if (hashed >= 0){
  scrollDeckTo(hashed, false);
  scrollPageToStage();
}
placeCover();
})();
</script>

.floor i{position:absolute;left:-70%;right:-70%;top:0;bottom:0;transform-origin:50% 100%;transform:rotateX(68deg);opacity:.22;background-image:linear-gradient(rgba(159,211,236,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(159,211,236,.35) 1px,transparent 1px);background-size:96px 96px}

@media (max-width:340px){.brand__id{letter-spacing:.08em}}
.head{padding:16px 0 0}

.head__k::before{content:"";width:22px;height:1px;flex:none;background:linear-gradient(90deg,var(--ice),transparent)}
.head__t{margin:0;font-size:32px;font-weight:700;line-height:1.25;letter-spacing:.02em;white-space:nowrap;text-wrap:pretty;background:linear-gradient(178deg,#FFF5E6 6%,var(--gold-l) 40%,var(--gold) 72%,#8C6742 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold-l)}

.rule{margin:0 0 8px;font-size:15px;line-height:1.7;color:rgba(242,236,230,.9)}

.sec__t{text-wrap:pretty}

.chan{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar));z-index:24;
  display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;

}

  .chan{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
}
.chan a{
  flex:none;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-led);font-size:12px;font-weight:700;letter-spacing:.04em;text-decoration:none;

}
.chan a:active{background:rgba(199,155,110,.16)}
/* ---------- 十二场对照 ---------- */
.board{display:grid;gap:10px}
@media (min-width:800px){.board{grid-template-columns:1fr 1fr;gap:12px}}
.card{
  position:relative;z-index:0;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:44px;
  padding:13px 13px 12px;border:1px solid rgba(199,155,110,.3);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.card input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.card:focus-within{outline:2px solid var(--ice);outline-offset:2px}
.card.is-on,.card:has(input:checked){border-color:rgba(240,214,182,.9);background:linear-gradient(180deg,rgba(199,155,110,.16),rgba(199,155,110,.04))}
.card__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card__top b{font-family:var(--font-led);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--gold-l)}
.card__flag{display:none;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold-hi)}
.card.is-on .card__flag,.card:has(input:checked) .card__flag{display:inline}
.card__sq{width:14px;height:14px;border:1px solid rgba(240,214,182,.8);flex:none}
.card.is-on .card__sq,.card:has(input:checked) .card__sq{background:var(--gold-l);box-shadow:inset 0 0 0 3px #201614}
.card__top .card__end{display:flex;align-items:center;gap:8px}
.card__name{font-size:16px;font-weight:700;line-height:1.45;text-wrap:pretty;color:#FFF6EA}
.card__who{font-size:14px;line-height:1.4;color:var(--gold-l)}
.card__meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:4px;font-size:13px;color:rgba(159,211,236,.92)}
.card__meta b{margin-left:6px;font-weight:700;color:rgba(242,236,230,.92)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 var(--pad) calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(180deg,rgba(32,22,20,0),#201614 14px)}

@media (hover:hover) and (pointer:fine){

.hold{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:0 14px;
  border:1px solid rgba(199,155,110,.6);background:rgba(32,22,20,.9);color:var(--gold-l);

.hold:disabled,.hold[aria-disabled="true"]{color:var(--gold-l);opacity:1}
.in{opacity:0;transform:translateY(12px);animation:bootIn .8s cubic-bezier(.22,1,.36,1) forwards}
.in1{animation-delay:.08s}.in2{animation-delay:.16s}.in3{animation-delay:.26s}.in4{animation-delay:.36s}
@keyframes bootIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .in{opacity:1;transform:none}
}
@media (forced-colors:active){
  .head__t{background:none;-webkit-text-fill-color:CanvasText;color:CanvasText}

  .toc__tab,.toc__panel{background:Canvas;color:CanvasText;border:1px solid CanvasText}
}
/* ---------- 右侧目录：收起只留把手，点箭头或向左滑打开 ---------- */
.toc{
  position:fixed;z-index:32;
  top:calc(env(safe-area-inset-top,0px) + var(--bar) + 8px);
  bottom:calc(120px + env(safe-area-inset-bottom,0px));
  right:env(safe-area-inset-right,0px);
  width:min(240px,calc(100% - 118px));
  transform:translateX(calc(100% - 44px));
  transition:transform .28s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}
.toc.is-open{transform:none}
.toc__tab{
  pointer-events:auto;position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:44px;height:64px;display:flex;align-items:center;justify-content:center;
  padding:0;border:1px solid rgba(199,155,110,.62);border-right:0;background:#3A2824;color:var(--gold-l);

}
.toc__tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .28s cubic-bezier(.22,1,.36,1)}
.toc.is-open .toc__tab svg{transform:scaleX(-1)}
.toc__panel{
  pointer-events:auto;position:absolute;left:44px;top:0;right:0;bottom:0;overflow:auto;

.toc__k{margin:0 4px 8px;font-family:var(--font-led);font-size:9px;letter-spacing:.22em;color:rgba(159,211,236,.86)}

  .toc a:hover{color:#fff}
  .toc__tab:hover{color:var(--gold-hi)}
}
</style>

<script>
(function(){
'use strict';
/* 选中只改这台手机上的句子，不提交、不记到本地 */
var note = document.getElementById('pick-note');
var cards = document.querySelectorAll('.card');
function paint(){
  cards.forEach(function(c){
    c.classList.toggle('is-on', c.querySelector('input').checked);
  });
}
cards.forEach(function(c){
  c.querySelector('input').addEventListener('change', function(){
    paint();
    note.textContent = c.querySelector('.card__top b').textContent + ' 这场已记在这台手机上，还不能提交。';
  });
});
document.querySelectorAll('.hold').forEach(function(b){
  b.addEventListener('click', function(e){ e.preventDefault(); });
});
})();
</script>
<script>
(function(){
'use strict';
/* 右侧目录：点箭头，或从右缘向左滑。收起时链接不进 Tab 序 */
var root = document.getElementById('toc');
var tab = root.querySelector('.toc__tab');
var panel = document.getElementById('toc-panel');
var open = false;
var swallow = false;
function setOpen(next){
  open = next;
  root.classList.toggle('is-open', open);
  tab.setAttribute('aria-expanded', open ? 'true' : 'false');
  tab.setAttribute('aria-label', open ? '收起目录' : '打开目录');
  panel.inert = !open;
}
tab.addEventListener('click', function(){
  if (swallow){ swallow = false; return; }
  setOpen(!open);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && open){ setOpen(false); tab.focus(); }
});
panel.addEventListener('click', function(e){
  var a = e.target.closest('a');
  if (!a) return;
  if ((a.getAttribute('href') || '').charAt(0) === '#') setOpen(false);
});
var sx = 0, sy = 0, armed = false, pid = null;
document.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var near = e.clientX >= window.innerWidth - 56;
  var inside = open && root.contains(e.target);
  if (!near && !inside) return;
  armed = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY;
});
document.addEventListener('pointerup', function(e){
  if (!armed || e.pointerId !== pid) return;
  armed = false;
  var dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
  if (tab.contains(e.target)){
    swallow = true;
    setTimeout(function(){ swallow = false; }, 350);
  }
  setOpen(dx < 0);
});
document.addEventListener('pointercancel', function(){ armed = false; });
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#7F584D">
<meta name="robots" content="noindex">
<title>十二场工作坊 · 无限可能的学校</title>
<meta name="description" content="2026 年 12 月 5 日 11:35–12:35 的十二场平行工作坊。提前报名，报满即止。地点和名额之后补充。">
<style>
/* ==========================================================
   十二场 · 同时段对照，不是一条任务清单
   可以先点一场，选中只留在这台手机上。
   地点、名额、报名都还没接上，按钮照实说。
   ========================================================== */
@font-face{font-family:"Orbitron";src:url("assets/orbitron-500.woff2") format("woff2");font-weight:400 600;font-display:block}
@font-face{font-family:"Orbitron";src:url("assets/orbitron-700.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Orbitron";src:url("assets/orbitron-900.woff2") format("woff2");font-weight:800 900;font-display:block}
:root{
  --ink:#04030A;--violet:#3B227B;--violet-l:#6B4EC4;
  --gold:#C79B6E;--gold-l:#F0D6B6;--gold-hi:#FFD9A8;
  --ice:#9FD3EC;--paper:#F2ECE6;--neon:#FF6FB5;
  --font-cn:"PingFang SC","Hiragino Sans GB","Heiti SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-led:"Orbitron","SF Mono",Menlo,ui-monospace,monospace;
  /* 全站统一字阶：五页同值。小屏缩放仍由各页 media 单独负责。 */
  --fs-h1:32px;--fs-h2:22px;--fs-lead:16px;--fs-kicker:14px;--fs-small:13px;--fs-note:12px;--fs-deco:9px;
  --pad:18px;--bar:52px;
}
@media (min-width:390px){:root{--pad:20px}}
@media (min-width:768px){:root{--pad:28px}}
*,*::before,*::after{box-sizing:border-box}
html{background:#4B342F;color-scheme:dark;-webkit-text-size-adjust:100%;scroll-padding-top:72px;scroll-padding-bottom:160px;overscroll-behavior-x:none}
html,body{margin:0;padding:0}
body{background:#4B342F;color:#FFD9A8;font-family:var(--font-cn);padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
::selection{background:rgba(199,155,110,.35);color:#fff}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(92% 46% at 8% -10%, rgba(215,149,128,.24), transparent 62%),
  radial-gradient(70% 38% at 108% 8%, rgba(162,156,178,.16), transparent 60%),
  radial-gradient(78% 42% at 70% 108%, rgba(208,172,104,.14), transparent 58%),
  linear-gradient(180deg, #7F584D 0%, #684840 48%, #4B342F 100%)}
.floor{position:fixed;left:0;right:0;bottom:0;height:22vh;z-index:0;pointer-events:none;overflow:hidden;perspective:760px;perspective-origin:50% 0%;-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 78%);mask-image:linear-gradient(to top,#000 0%,transparent 78%)}
.floor i{position:absolute;left:-70%;right:-70%;top:0;bottom:0;transform-origin:50% 100%;transform:rotateX(68deg);opacity:.22;background-image:linear-gradient(rgba(159,211,236,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(159,211,236,.35) 1px,transparent 1px);background-size:96px 96px}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.2;background:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.frame{position:fixed;inset:0;z-index:4;pointer-events:none}
.frame__line{position:absolute;inset:8px;border:1px solid rgba(199,155,110,.14)}
.frame__c{position:absolute;width:14px;height:14px;border:1px solid rgba(199,155,110,.62)}
.frame__c--tl{top:8px;left:8px;border-right:0;border-bottom:0}
.frame__c--tr{top:8px;right:8px;border-left:0;border-bottom:0}
.frame__c--bl{bottom:8px;left:8px;border-right:0;border-top:0}
.frame__c--br{bottom:8px;right:8px;border-left:0;border-top:0}
.rail{display:none}
@media (min-width:1180px){
  .rail{display:block;position:fixed;top:50%;z-index:4;font-family:var(--font-led);font-size:8px;letter-spacing:.28em;color:rgba(201,232,246,.55);white-space:nowrap;writing-mode:vertical-rl;transform:translateY(-50%);pointer-events:none}
  .rail--l{left:14px}.rail--r{right:14px}
}
.wrap{position:relative;z-index:5;max-width:720px;margin:0 auto;padding:14px var(--pad) 0}
@media (min-width:800px){.wrap{max-width:980px}}
.skip-link{position:absolute;left:12px;top:-60px;z-index:60;min-height:44px;padding:10px 14px;box-sizing:border-box;background:var(--gold-l);color:#1A1024;font-weight:700;text-decoration:none}
.skip-link:focus{top:8px;outline:2px solid var(--ice);outline-offset:2px}
.brand{
  --col:720px;
  position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:2px;
  height:calc(env(safe-area-inset-top,0px) + var(--bar));box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) max(8px,calc((100% - var(--col)) / 2)) 0 max(var(--pad),calc((100% - var(--col)) / 2 + var(--pad)));
  background:#7F584D;border-bottom:1px solid rgba(255,217,168,.22);
}
@media (min-width:800px){.brand{--col:980px}}
.brand__id{flex:1;min-width:0;display:flex;align-items:center;gap:8px;margin:0;font-family:var(--font-led);font-weight:700;font-size:9px;letter-spacing:.12em;white-space:nowrap;color:rgba(255,217,168,.86)}
.brand__id i{font-style:normal;font-size:15px;line-height:1;color:#FFE8C4;text-shadow:0 0 12px rgba(255,217,168,.35)}
.toc-btn{
  flex:none;box-sizing:border-box;min-width:44px;height:44px;margin:0;padding:0 6px;
  border:0;background:transparent;color:rgba(255,217,168,.92);
  font-family:var(--font-cn);font-size:15px;font-weight:700;letter-spacing:.08em;line-height:1;
  white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.toc-btn:focus-visible,.chan a:focus-visible,.hold:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.toc-btn:active,.toc-btn[aria-expanded="true"]{color:#FFE8C4}
@media (max-width:340px){.brand__id{letter-spacing:.08em}}
/* 手机上顶栏跟着页走。点某一场之后，说明和顶栏滚出视口，数字条才能贴在屏幕顶。 */
@media (max-width:899px){
  .brand{position:relative;top:auto}
}
.head{padding:16px 0 0}
.head__k{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:var(--font-led);font-size:9px;letter-spacing:.22em;color:#C9E8F6}
.head__k::before{content:"";width:22px;height:1px;flex:none;background:linear-gradient(90deg,var(--ice),transparent)}
.head__t{margin:0;font-size:var(--fs-h1);font-weight:700;line-height:1.25;letter-spacing:0;white-space:nowrap;text-wrap:pretty;background:linear-gradient(178deg,#FFF1D6 4%,#FFE0B0 36%,#FFD9A8 68%,#F8E3C6 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#FFD9A8}
.lock{display:flex;align-items:baseline;gap:8px;margin:12px 0 0;font-family:var(--font-led);font-weight:700;font-size:32px;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#FFD9A8;line-height:1}
.lock span{font-family:var(--font-cn);font-size:14px;font-weight:600;letter-spacing:.08em;color:#C9E8F6}
@media (max-width:360px){.head__t{font-size:28px}.lock{font-size:26px}.head__k{letter-spacing:.12em}}
.sec{margin-top:8px}
.sec__k{margin:14px 0 8px;font-family:var(--font-cn);font-size:var(--fs-kicker);font-weight:600;letter-spacing:.06em;line-height:1.4;font-variant-numeric:tabular-nums;color:#FFD9A8}
.sec__t{margin:0 0 8px;font-size:var(--fs-h2);font-weight:700;line-height:1.35;color:#FFE0B0}
.rule{margin:0 0 8px;font-size:15px;line-height:1.7;color:#FFD9A8}
.pending{margin:0 0 12px;font-size:14px;line-height:1.6;color:rgba(255,217,168,.88)}
.sec__t{text-wrap:pretty}
#rooms{scroll-margin-top:12px;scroll-margin-bottom:110px}
.card{scroll-margin-top:72px;scroll-margin-bottom:110px}
fieldset{border:0;margin:0;padding:0;min-width:0}
/* ---------- 场次跳转：自己横滑，不撑开页面 ---------- */
.chan{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar));z-index:24;
  display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;
  margin:0 calc(var(--pad) * -1);padding:8px var(--pad) 8px;
  background:#7F584D;border-bottom:1px solid rgba(255,217,168,.22);
  scrollbar-color:rgba(199,155,110,.45) transparent;
}
@media (max-width:720px){
  .chan{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
}
.chan a{
  flex:none;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-led);font-size:12px;font-weight:700;letter-spacing:.04em;text-decoration:none;
  color:#FFD9A8;border:1px solid rgba(255,217,168,.4);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.chan a:active{background:rgba(199,155,110,.16)}
.chan a[aria-current="true"]{border-color:#FFD9A8;background:rgba(255,217,168,.18);color:#FFE0B0}
@media (max-width:899px){.chan{top:0}}
/* ---------- 十二场：封面流。中间最大，两侧透视立起，像在翻专辑 ---------- */
.stage{position:relative}
/* 透明底箭头：贴屏幕两边，点击前后换卡；首张只有下一张，末张只有上一张。 */
.edge{
  position:absolute;top:50%;transform:translateY(-50%);z-index:90;
  width:44px;height:64px;display:flex;align-items:center;justify-content:center;
  padding:0;border:0;background:transparent;color:#FFD9A8;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  filter:drop-shadow(0 1px 3px rgba(40,20,12,.55));
}
.edge--prev{left:-6px}
.edge--next{right:-6px}
.edge:active{color:#FFF1D6;transform:translateY(-50%) scale(.9)}
.edge[hidden]{display:none}
.deck{
  counter-reset:workshop;
  display:flex;align-items:stretch;
  margin:4px 8px 0;padding:10px 0 18px;
  overflow-x:auto;overflow-y:hidden;
  /* 横滑完全走浏览器原生滚动 + 惯性 + mandatory 吸附；纵向手势交回页面。 */
  touch-action:pan-x pan-y;
  scroll-snap-type:x mandatory;scroll-padding-inline:0;
  overscroll-behavior-x:contain;
  scrollbar-width:none;
  /* 每张卡单独使用透视，避免滚动容器的 overflow 压平层级。 */
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.deck::-webkit-scrollbar{display:none;height:0}
.deck .card{scroll-snap-align:center;scroll-snap-stop:normal}
.gesture{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:26px;margin:6px 12px 0;color:#C9E8F6;font-size:var(--fs-small);line-height:1.4;letter-spacing:.05em}
.gesture b{flex:none;font-family:var(--font-led);font-size:10px;font-weight:700;letter-spacing:.08em;color:#FFD9A8;font-variant-numeric:tabular-nums}
.card{
  counter-increment:workshop;
  flex:0 0 100%;
  position:relative;z-index:0;display:flex;justify-content:center;
  min-width:0;min-height:44px;padding:4px 0 10px;
  align-items:center;
  background:transparent;border:0;box-shadow:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.card__face{
  width:min(82%,440px);min-width:0;
  aspect-ratio:4/7;
  display:flex;flex-direction:column;gap:10px;
  padding:20px 20px 18px;border-radius:32px;
  border:1px solid rgba(92,44,32,.14);
  background:
    radial-gradient(120% 72% at 4% 0%,rgba(255,255,255,.96),transparent 62%),
    linear-gradient(145deg,#FFFDF9 0%,#FFF6EE 52%,#F5E5D7 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.96),
    0 16px 28px rgba(83,39,29,.18),
    0 30px 60px rgba(55,25,20,.12);
  transform:perspective(1100px) translate3d(var(--tx,0px),var(--ty,0px),0) rotateY(var(--ry,0deg)) scale(var(--sc,1));
  transform-origin:50% 58%;
  backface-visibility:hidden;
  position:relative;
}
.card__face::before{
  content:counter(workshop,decimal-leading-zero);
  position:absolute;z-index:0;right:14px;bottom:46px;pointer-events:none;
  font-family:var(--font-led);font-size:clamp(96px,31vw,156px);font-weight:900;line-height:.8;letter-spacing:-.09em;
  color:rgba(127,88,77,.065);
}
.card__face::after{
  content:"";position:absolute;z-index:3;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg,#F7E9DE 0%,#D8B7A3 100%);opacity:var(--veil,0);
}
.card__face>*{position:relative;z-index:1}
.card input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;pointer-events:none}
.card:focus-within .card__face{outline:2px solid var(--ice);outline-offset:3px}
/* will-change 只给当前及相邻卡（JS 动态加 .is-live），避免 12 张大纹理常驻显存。 */
.card.is-live .card__face{will-change:transform}
.card.is-on .card__face{
  border-color:#9A673A;
  background:
    radial-gradient(120% 72% at 4% 0%,rgba(255,255,255,.98),transparent 62%),
    linear-gradient(145deg,#FFFDF8 0%,#FFF2E4 58%,#EFD3B8 100%);
}
.card__top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:14px;border-bottom:1px solid rgba(62,40,12,.12)}
.card__top b{font-family:var(--font-led);font-size:18px;font-weight:700;letter-spacing:.04em;color:#3E280C}
.card__flag{display:none;font-size:12px;font-weight:700;letter-spacing:.08em;color:#6C461F}
.card.is-on .card__flag{display:inline}
.card__sq{width:16px;height:16px;border:1px solid #A88B76;flex:none;background:rgba(255,255,255,.36)}
.card.is-on .card__sq{background:#3E280C;box-shadow:inset 0 0 0 4px #F0D6B6;border-color:#3E280C}
.card__top .card__end{display:flex;align-items:center;gap:8px}
.card__name{font-size:clamp(18px,4.8vw,23px);font-weight:700;line-height:1.5;letter-spacing:.01em;text-wrap:pretty;color:var(--ink)}
.card__who{display:flex;align-items:center;gap:7px;font-size:14px;line-height:1.5;color:#6E4C3C}
.card__who::before{content:"";width:15px;height:1px;flex:none;background:#C79B6E}
/* 卡片按实际可见区域定高，文字过长时只滚正文，地点与名额始终留在框底。 */
.card__body{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;
  overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(199,155,110,.45) transparent;
}
@media (max-width:899px){
  .deck{margin-top:4px;padding-top:8px;padding-bottom:14px}
  .card{height:auto;min-height:0}
  .card__meta{margin-top:0}
}
@media (max-width:340px) and (max-height:580px){
  :root{--bar:44px}
  .wrap{padding-top:6px}
  .head{padding-top:2px}
  .head__k{margin-bottom:2px}
  .head__t{font-size:24px;line-height:1.15}
  .lock{margin-top:2px;font-size:22px}
  .sec{margin-top:2px}
  .sec__k{margin:4px 0 2px}
  .sec__t{font-size:18px;margin-bottom:2px}
  .rule,.pending{font-size:13px;line-height:1.35;margin-bottom:4px}
  .card__face{padding:16px 16px 14px;border-radius:26px}
  .card__top{padding-bottom:10px}
  .card__name{font-size:17px}
  .gesture{margin-top:2px;min-height:22px}
}
@media (min-width:900px){
  .card{height:auto;min-height:0}
  /* PC 与手机同比例：竖版 4/7，宽度收在海报舒适阅读尺寸 */
  .card__face{width:min(52%,380px);aspect-ratio:4/7}
}
.card__meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:12px;border-top:1px solid rgba(62,40,12,.12);font-size:var(--fs-small);color:#564034}
.card__meta b{margin-left:6px;font-weight:700;color:var(--ink)}
/* ---------- 十二场：每卡一扇木门 + 锁眼。点任意一扇，十二扇全开（永不关）。
   开门那一下不预选；开后再点正常预选/撤销。
   全部 transform/opacity 合成器动画；门与海报都限制在卡片圆角内。
   海报必须「下载完整 + 解码完成」才开门，iOS Safari 渐进式 JPEG 边下边显示
   会出现半截/马赛克，这里用 decode() 兜住。 ---------- */
.card--door .card__face{overflow:hidden}
/* 门/锁/提示层级高于卡内文字（文字 z-index:1），关着时完全盖住旧卡面。 */
.card__poster{
  position:absolute;inset:0;z-index:2;width:100%;height:100%;
  object-fit:cover;object-position:top center;border-radius:inherit;
  /* 完整下载并解码后才淡入，杜绝 Safari 边下边渲染的半截/马赛克画面 */
  opacity:0;transition:opacity .35s ease;
}
.card__poster.is-ready{opacity:1}
.card__door{
  position:absolute;inset:0;z-index:4;border-radius:inherit;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 2px,transparent 2px 46px),
    radial-gradient(130% 60% at 50% 0%,rgba(255,217,168,.12),transparent 62%),
    linear-gradient(160deg,#5F423A 0%,#4B342F 55%,#382622 100%);
  border:1px solid rgba(255,217,168,.4);
  transform-origin:right center;
  transition:transform .7s cubic-bezier(.6,0,.32,1);
  backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.card--door.is-open .card__door{transform:perspective(900px) rotateY(104deg)}
/* 门板装饰：内框线 + 场次编号 + 提示 */
.card__door::before{
  content:"";position:absolute;inset:12px;border:1px solid rgba(255,217,168,.28);border-radius:20px;pointer-events:none;
}
.card__door-num{
  font-family:var(--font-led);font-size:clamp(72px,24vw,120px);font-weight:900;line-height:.9;
  color:rgba(255,217,168,.5);letter-spacing:-.06em;
}
.card__door-t{color:#FFD9A8;font-size:12px;font-weight:600;letter-spacing:.14em;text-indent:.14em}
.card__door-sub{color:rgba(255,217,168,.6);font-size:11px;letter-spacing:.14em;padding:0 18px;text-align:center}
/* 门开后预选标记：海报右上角一枚金框角标（原卡内标记被海报盖住） */
.card__pick{
  position:absolute;z-index:6;top:12px;right:12px;pointer-events:none;
  padding:5px 12px;border-radius:999px;
  background:rgba(30,17,12,.78);border:1px solid rgba(255,217,168,.55);
  color:#FFD9A8;font-size:12px;font-weight:700;letter-spacing:.1em;
  opacity:0;transform:translateY(-6px);
  transition:opacity .25s ease,transform .25s ease;
}
.card.is-on .card__pick{opacity:1;transform:translateY(0)}
.card--door.is-open.is-on .card__face{border-color:#C79B6E;box-shadow:inset 0 0 0 2px rgba(199,155,110,.8),0 16px 28px rgba(83,39,29,.18),0 30px 60px rgba(55,25,20,.12)}
/* 门开后旧卡面文字退场（纯 opacity），只留海报与预选角标 */
.card--door.is-open .card__top,
.card--door.is-open .card__body,
.card--door.is-open .card__meta{opacity:0;pointer-events:none;transition:opacity .3s ease .25s}
/* 锁眼：门板左缘（开门侧，右缘是铰链）只有一个钥匙孔形（圆孔+梯形孔），
   与门同色系但更深，像凿进门里的暗孔；下缘一丝金高光衬出孔形。
   是门的子元素，随门一起旋开消失。 */
.card__keyhole{
  position:absolute;left:22px;top:50%;transform:translateY(-50%);
  width:18px;height:27px;pointer-events:none;
  filter:drop-shadow(0 1px 1px rgba(255,217,168,.28));
}
.card__keyhole i{position:relative;width:18px;height:27px;display:block}
.card__keyhole i::before{
  content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);

var pickState = document.getElementById('pick-state');
var pickCurrent = document.getElementById('pick-current');
var hold = document.getElementById('submit-hold');
function paint(){
  cards.forEach(function(c){
    c.classList.toggle('is-on', c.querySelector('input').checked);
  });
}
function arm(){
  if (!hold || hold.classList.contains('is-ready')) return;
  hold.href = FORM_URL;
  hold.removeAttribute('role');
  hold.removeAttribute('aria-disabled');
  hold.removeAttribute('tabindex');
  hold.setAttribute('aria-label','前往金数据登记（当前页面打开）');
  hold.classList.add('is-ready');
}
function disarm(){
  if (!hold) return;
  hold.removeAttribute('href');
  hold.removeAttribute('target');
  hold.removeAttribute('rel');
  hold.setAttribute('role','button');
  hold.setAttribute('aria-disabled','true');
  hold.setAttribute('tabindex','-1');
  hold.setAttribute('aria-label','点击卡片预选一场，再前往登记');
  hold.textContent = '点击卡片预选，再前往登记';
  hold.classList.remove('is-ready');
}
function pick(c){
  var input = c.querySelector('input');
  var number = c.querySelector('.card__top b').textContent;
  var who = c.querySelector('.card__who').textContent;
  paint();
  note.textContent = number + ' 这场已在本次页面预选，尚未提交；请点下方按钮前往登记，再点一次卡片可撤销。';
  pickState.textContent = '已预选 ' + number;
  pickCurrent.textContent = who + ' · 待登记';
  dockChoice.classList.add('is-pick');
  if (hold) hold.textContent = '前往登记 · ' + number + ' 场';
  arm();
}
function clearPick(){
  var note = document.getElementById('pick-note');
  paint();
  note.textContent = '点卡片预选，再点一次可撤销；选好后点下方按钮前往登记。';
  pickState.textContent = '十二选一';
  pickCurrent.textContent = '名额有限 · 报满即止';
  dockChoice.classList.remove('is-pick');
  disarm();
}
cards.forEach(function(c){
  var input = c.querySelector('input');
  /* change：radio 选中时触发（点未选中的卡）。 */
  input.addEventListener('change', function(){
    if (input.checked) pick(c);
  });
  /* click：点已选中的卡时，radio 不会触发 change，这里手动撤销。
     转发到 input 的合成 click 跳过（target 是 input），只处理真实点卡面的那一次。
     01 关门时 input 未选中，走不到撤销分支；开门后与其他卡行为一致。 */
  c.addEventListener('click', function(e){
    if (e.target.closest('input')) return;
    if (input.checked){
      e.preventDefault();
      input.checked = false;
      clearPick();
    }
  });
});
if (hold){
  hold.addEventListener('click', function(e){
    if (hold.getAttribute('aria-disabled') === 'true') e.preventDefault();
  });
}
/* ---------- 十二场门联动：点任意一扇未开的门 → 十二扇全开，永不关。
   门立即开（纯 CSS transform，流畅），海报在门后独立加载淡入，二者解耦：
   —— 不再让海报的下载/解码阻塞开门（此前 Promise 卡住会让门迟迟不开甚至状态错乱）。
   —— 海报用 .is-ready 淡入，仍杜绝半截/马赛克。 ---------- */
var doorsOpened = false;
var postersLoaded = false;
function loadPosters(){
  if (postersLoaded) return;
  postersLoaded = true;
  document.querySelectorAll('.card__poster[data-src]').forEach(function(img){
    /* 先赋 src 再 arm：无 src 的 img.complete 恒为 true 且 naturalWidth=0，
       若先 arm 会误判「加载失败」而提前 settle，导致海报永不淡入。 */
    img.src = img.getAttribute('data-src');
    img.removeAttribute('data-src');
    armPoster(img);
  });
}
/* 单张海报：下载 + 解码完成后加 .is-ready 淡入。只负责海报自己的显示，不阻塞开门。
   修复：load 监听在 armPoster 时始终挂上（img.src 尚未赋值时 complete 必为 false），
   此前只在「首次就 complete」时才走 settle，导致后续加载完成无回调、海报永不淡入。 */
function armPoster(img){
  if (img._posterP) return img._posterP;
  img._posterP = new Promise(function(resolve){
    var settled = false;
    function ready(){
      if (settled) return;
      settled = true;
      img.classList.add('is-ready');
      resolve();
    }
    function fail(){ if (!settled){ settled = true; resolve(); } }
    /* 图已就绪：直接淡入。不再依赖 decode()（其 Promise 在部分浏览器会永久 pending）。 */
    function settle(){
      if (img.complete && img.naturalWidth > 0){ ready(); }
      else if (img.complete){ fail(); }
    }
    img.addEventListener('load', settle, {once:true});
    img.addEventListener('error', fail, {once:true});
    /* 只有图真的加载出来了（naturalWidth>0）才 settle；
       src 刚赋值、尚未加载完成时 complete=false，等 load 事件。 */
    if (img.complete && img.naturalWidth > 0) settle();
    /* 兜底：无论如何 4s 后放行，绝不因任何加载/解码卡住而让海报永远透明 */
    setTimeout(function(){ if (!settled) ready(); }, 4000);
  });
  return img._posterP;
}
/* 门都关着，海报空闲时逐张预取，不与首屏抢带宽；点击时兜底立即加载。 */
if ('requestIdleCallback' in window) requestIdleCallback(loadPosters, {timeout:3500});
else setTimeout(loadPosters, 1500);
function openAllDoors(origin){
  if (doorsOpened) return;
  doorsOpened = true;
  loadPosters();
  var originIdx = origin ? cards.indexOf(origin) : 0;
  /* 门立即开，不等海报：被点的先开，其余按距离错峰开（纯 transform，合成器渲染）。 */
  cards.forEach(function(c, i){
    if (!c.classList.contains('card--door')) return;
    var delay = Math.abs(i - originIdx) * 70;
    setTimeout(function(){ c.classList.add('is-open'); }, delay);
  });
}
cards.forEach(function(c){
  if (!c.classList.contains('card--door')) return;
  /* 预选角标：门开后海报右上角显示「已预选」 */
  var badge = document.createElement('span');
  badge.className = 'card__pick';
  badge.setAttribute('aria-hidden','true');
  badge.textContent = '已预选';
  c.querySelector('.card__face').appendChild(badge);
  /* 键盘/旁路选中 radio 也让门全开，保证选中时看得到海报。 */
  c.querySelector('input').addEventListener('change', function(){ openAllDoors(c); });
  /* 点击卡片：门没开时只开门、不预选（预选留给开门后的下一次点击）。 */
  c.addEventListener('click', function(e){
    if (e.target.closest('input')) return;
    if (!doorsOpened){
      e.preventDefault();
      openAllDoors(c);
    }
  });
});
})();
</script>
<script>
(function(){
'use strict';
/* 右上角「目录」打开这一层。收起时链接不进 Tab 序。右缘不留把手，也不再靠左滑打开。 */
var root = document.getElementById('toc');
var btn = document.getElementById('toc-btn');
var panel = document.getElementById('toc-panel');
var open = false;
function setOpen(next, restoreFocus){
  open = next;
  root.classList.toggle('is-open', open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  panel.inert = !open;
  if (open){
    var currentLink = panel.querySelector('a[aria-current="page"]') || panel.querySelector('a');
    if (currentLink) currentLink.focus({preventScroll:true});
  }else if (restoreFocus){
    btn.focus({preventScroll:true});
  }
}
btn.addEventListener('click', function(){ setOpen(!open, open); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && open) setOpen(false, true);
});
panel.addEventListener('click', function(e){
  var a = e.target.closest('a');
  if (a) setOpen(false);
});
/* 链接一旦被使用就收起；pagehide 同时覆盖后退缓存，返回时不会恢复成打开状态。 */
window.addEventListener('pagehide', function(){ setOpen(false); });
window.addEventListener('pageshow', function(e){ if (e.persisted) setOpen(false); });
var sx = 0, sy = 0, armed = false, pid = null;
document.addEventListener('pointerdown', function(e){
  if (!open) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (!panel.contains(e.target)) return;
  armed = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY;
});
document.addEventListener('pointerup', function(e){
  if (!armed || e.pointerId !== pid) return;
  armed = false;
  var dx = e.clientX - sx, dy = e.clientY - sy;
  if (dx < 48 || Math.abs(dx) < Math.abs(dy)) return;
  setOpen(false);
});
document.addEventListener('pointercancel', function(){ armed = false; });
})();
</script>
<script>
(function(){
'use strict';
/* 几何数据只在初始化与尺寸变化时测量；手指滑动时只计算附近五张卡。 */
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var deck = document.getElementById('deck');
var chan = document.querySelector('.chan');
if (!deck || !chan) return;
var counter = document.getElementById('deck-count');
var prevBtn = document.getElementById('deck-prev');
var nextBtn = document.getElementById('deck-next');
var links = Array.prototype.slice.call(chan.querySelectorAll('a'));
var cards = Array.prototype.slice.call(deck.querySelectorAll('.card'));
var faces = cards.map(function(c){ return c.querySelector('.card__face'); });
var metrics = [];
var activeFaces = [];
var current = -1;
var raf = 0;
var resizeRaf = 0;
var endTimer = 0;
var viewW = 0;
var slotW = 0;
var firstLeft = 0;
var drag = null;
var suppressClick = false;

function motion(){ return reduce ? 'auto' : 'smooth'; }
function clampIndex(i){ return Math.max(0, Math.min(cards.length - 1, i)); }
function indexFromScroll(){ return slotW ? clampIndex(Math.round(deck.scrollLeft / slotW)) : 0; }

function setFace(i, prop, value){
  var face = faces[i];
  var cache = face._cover || (face._cover = {});
  if (cache[prop] === value) return;
  cache[prop] = value;
  face.style.setProperty(prop, value);
}
function setLevel(i, value){
  if (cards[i]._coverLevel === value) return;
  cards[i]._coverLevel = value;
  cards[i].style.zIndex = value;
}
function resetFace(i){
  setFace(i, '--tx', '0px');
  setFace(i, '--ty', '0px');
  setFace(i, '--ry', '0deg');
  setFace(i, '--sc', '1');
  setFace(i, '--veil', '0');
  setLevel(i, '0');
}

function setLive(i, on){
  if (cards[i]._live === on) return;
  cards[i]._live = on;
  cards[i].classList.toggle('is-live', on);
}
function placeCover(index){
  if (!viewW || !metrics.length) return;
  var old = activeFaces.slice();
  var from = Math.max(0, index - 1);
  var to = Math.min(cards.length - 1, index + 1);
  for (var j = 0; j < old.length; j++){
    if (old[j] < from || old[j] > to || reduce){ resetFace(old[j]); setLive(old[j], false); }
  }
  activeFaces = [];
  if (reduce){
    setLevel(index, '80');
    return;
  }
  var scroll = deck.scrollLeft;
  for (var i = from; i <= to; i++){
    var natural = metrics[i].center - scroll;
    var t = (natural - viewW / 2) / viewW;
    var a = Math.abs(t);
    if (a > 1.6){ resetFace(i); setLive(i, false); continue; }
    var direction = t < 0 ? -1 : 1;
    var near = Math.min(a, 1);
    var far = Math.max(0, Math.min(1, a - 1));
    var scale = 1 - Math.min(a, 2) * 0.055;
    var peek = 54 - far * 24;
    var half = metrics[i].faceW * scale / 2;
    var rest = viewW / 2 - peek + half;
    var target = viewW / 2 + direction * near * rest;
    var tx = target - natural;
    var ry = direction * (near * 18 + far * 6);
    var ty = near * 8 + far * 10;
    var veil = Math.min(0.96, near * 0.88 + far * 0.08);
    setFace(i, '--tx', tx.toFixed(2) + 'px');
    setFace(i, '--ty', ty.toFixed(2) + 'px');
    setFace(i, '--ry', ry.toFixed(2) + 'deg');
    setFace(i, '--sc', scale.toFixed(3));
    setFace(i, '--veil', veil.toFixed(3));
    setLevel(i, String(80 - Math.round(Math.min(a, 4) * 20)));
    setLive(i, true);
    activeFaces.push(i);
  }
}

function measureCards(){
  var nextW = deck.clientWidth;
  if (!nextW || (nextW === viewW && metrics.length)) return;
  viewW = nextW;
  for (var s = 0; s < cards.length; s++) cards[s].style.flexBasis = viewW + 'px';
  firstLeft = cards[0].offsetLeft;
  slotW = cards[0].offsetWidth;
  metrics = cards.map(function(card, i){
    return {
      center: firstLeft + i * slotW + slotW / 2,
      faceW: faces[i].offsetWidth
    };
  });
  activeFaces = [];
}

function fitCards(){
  document.body.style.paddingBottom = '';
  var baseBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
  var chanRect = chan.getBoundingClientRect();
  var targetScroll = chanRect.top + window.scrollY;
  var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  var deficit = targetScroll - maxScroll;
  if (deficit > 0) document.body.style.paddingBottom = Math.ceil(baseBottom + deficit + 2) + 'px';
}

function centerLink(i, smooth){
  var a = links[i];
  if (!a) return;
  var c = chan.getBoundingClientRect();
  var r = a.getBoundingClientRect();
  var delta = (r.left + r.width / 2) - (c.left + c.width / 2);
  if (Math.abs(delta) < 2) return;
  chan.scrollTo({left: chan.scrollLeft + delta, behavior: smooth ? motion() : 'auto'});
}

function setCurrent(i, reveal){
  if (i < 0 || i >= links.length) return;
  var changed = i !== current;
  current = i;
  if (changed){
    for (var n = 0; n < links.length; n++){
      if (n === i) links[n].setAttribute('aria-current', 'true');
      else links[n].removeAttribute('aria-current');
    }
    counter.textContent = ('0' + (i + 1)).slice(-2) + ' / 12';
    if (prevBtn) prevBtn.hidden = i === 0;
    if (nextBtn) nextBtn.hidden = i === cards.length - 1;
  }
  /* centerLink 只在序号真的变化、且需要让场次条露出当前项时才调；滑动中途不反复布局。 */
  if (changed && reveal) centerLink(i, false);
}

function scrollDeckTo(i, smooth){
  if (!slotW) return;
  deck.scrollTo({left: i * slotW, behavior: smooth ? motion() : 'auto'});
}

function scrollPageToStage(){
  if (window.innerWidth >= 900){
    var top = deck.getBoundingClientRect().top;
    if (top < 72 || deck.getBoundingClientRect().bottom > window.innerHeight - 24){
      window.scrollTo({top: top + window.scrollY - 76, behavior: motion()});
    }
    return;
  }
  var y = chan.getBoundingClientRect().top + window.scrollY;
  window.scrollTo({top: y, behavior: motion()});
}

function refresh(){
  resizeRaf = 0;
  var desired = current < 0 ? 0 : current;
  fitCards();
  measureCards();
  scrollDeckTo(desired, false);
  placeCover(desired);
  setCurrent(desired, true);
}
function queueRefresh(){
  if (!resizeRaf) resizeRaf = requestAnimationFrame(refresh);
}

/* 两侧箭头：点击前后换卡，走与场次条相同的原生平滑滚动 + 吸附。 */
function step(delta){
  var i = clampIndex(indexFromScroll() + delta);
  setCurrent(i, true);
  scrollDeckTo(i, true);
  if (history.replaceState) history.replaceState(null, '', links[i].getAttribute('href'));
}
if (prevBtn) prevBtn.addEventListener('click', function(){ step(-1); });
if (nextBtn) nextBtn.addEventListener('click', function(){ step(1); });

links.forEach(function(a, i){
  a.addEventListener('click', function(e){
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    setCurrent(i, true);
    centerLink(i, true);
    scrollDeckTo(i, true);
    scrollPageToStage();
    if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
  });
});

deck.addEventListener('scroll', function(){
  if (raf) return;
  raf = requestAnimationFrame(function(){
    raf = 0;
    var i = indexFromScroll();
    placeCover(i);
    setCurrent(i, true);
  });
}, {passive:true});

function inputActive(){ return !!(drag && drag.dragging); }
/* 原生 mandatory 吸附常驻；滚动结束后只同步地址 hash，不做任何滚动校正。 */
function settle(){
  var i = indexFromScroll();
  placeCover(i);
  setCurrent(i, true);
  if (history.replaceState) history.replaceState(null, '', links[i].getAttribute('href'));
}
function finishScroll(){
  if (inputActive()) return;
  settle();
}
if ('onscrollend' in deck){
  deck.addEventListener('scrollend', finishScroll);
}else{
  deck.addEventListener('scroll', function(){
    clearTimeout(endTimer);
    endTimer = setTimeout(finishScroll, 140);
  }, {passive:true});
}

/* 触摸横滑完全交给浏览器原生滚动（合成器线程，自带惯性与 mandatory 吸附），
   JS 不再逐帧写 scrollLeft。这里只保留鼠标拖拽与 Shift+滚轮，方便桌面端。 */
function releaseDrag(e){
  if (!drag || (e && e.pointerId !== drag.id)) return;
  var dragged = drag.dragging;
  var id = drag.id;
  drag = null;
  try { if (deck.hasPointerCapture(id)) deck.releasePointerCapture(id); } catch (err) {}
  if (dragged){
    suppressClick = true;
    setTimeout(function(){ suppressClick = false; }, 300);
    scrollDeckTo(indexFromScroll(), true);
  }
}
deck.addEventListener('pointerdown', function(e){
  if (e.pointerType !== 'mouse' || e.button !== 0 || drag) return;
  drag = {id:e.pointerId, x:e.clientX, y:e.clientY, scroll:deck.scrollLeft, dragging:false};
}, {passive:true});
deck.addEventListener('pointermove', function(e){
  if (!drag || e.pointerId !== drag.id) return;
  var dx = e.clientX - drag.x;
  if (!drag.dragging){
    if (Math.abs(dx) < 7) return;
    drag.dragging = true;
    try { deck.setPointerCapture(e.pointerId); } catch (err) {}
  }
  e.preventDefault();
  deck.style.scrollSnapType = 'none';
  deck.scrollLeft = drag.scroll - dx;
}, {passive:false});
deck.addEventListener('pointerup', function(e){
  deck.style.scrollSnapType = '';
  releaseDrag(e);
});
deck.addEventListener('pointercancel', function(e){
  deck.style.scrollSnapType = '';
  releaseDrag(e);
});
deck.addEventListener('lostpointercapture', releaseDrag);
deck.addEventListener('click', function(e){
  if (!suppressClick) return;
  e.preventDefault();
  e.stopPropagation();
  suppressClick = false;
}, true);
/* Shift+滚轮转横向；普通滚轮/触控板横滑走原生。 */
deck.addEventListener('wheel', function(e){
  if (!e.shiftKey) return;
  var unit = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? deck.clientWidth : 1);
  var dx = (e.deltaY || e.deltaX) * unit;
  if (!dx) return;
  e.preventDefault();
  deck.scrollLeft += dx;
}, {passive:false});

cards.forEach(function(c, i){
  c.querySelector('input').addEventListener('change', function(){
    if (!this.checked) return;
    setCurrent(i, true);
    if (Math.abs(deck.scrollLeft - i * slotW) > 4) scrollDeckTo(i, true);
  });
});

window.addEventListener('resize', queueRefresh);
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueRefresh);
fitCards();
measureCards();
var hashed = links.findIndex(function(a){ return a.getAttribute('href') === location.hash; });
var initial = hashed >= 0 ? hashed : 0;
setCurrent(initial, hashed >= 0);
scrollDeckTo(initial, false);
placeCover(initial);
if (hashed >= 0) scrollPageToStage();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueRefresh);
})();
</script>

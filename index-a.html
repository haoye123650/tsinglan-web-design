<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050308">
<title>无限游戏 · THE INFINITE GAME — 2026.12.05</title>
<meta name="description" content="第十三届中国教育创新年会（场外深研）暨清澜山学校第四届创新教育论坛，2026 年 12 月 5 日，东莞·清澜山学校。">
<style>
/* ============ 版本 A · TERMINAL ============
   设计 token
   底色 ink        #050308
   品牌紫 violet   #3B227B   （取自 PPT 模板）
   雾紫 muted      #8D7AA8
   金 gold         #C79B6E
   亮金 gold-l     #F0D6B6
   冰蓝 ice        #9FD3EC   （仅在极少量 HUD 细节出现）

   版式：单屏三段 = 顶部牌匾（双 logo + 场次信息）/ 中央巨型字标 + Play / 底部地址
   字标为活字处理（渐变金属 + 1px 色差偏移），不使用任何外部字体依赖
   =========================================== */

/* 若日后下载了得意黑，把字体文件放进 assets/ 即可自动生效 */
@font-face{
  font-family:"Smiley Sans";
  src:url("assets/SmileySans-Oblique.woff2") format("woff2");
  font-weight:400 700;
  font-display:swap;
}

:root{
  --ink:#050308;
  --violet-deep:#3B227B;
  --violet:#57476C;
  --muted:#8D7AA8;
  --gold:#C79B6E;
  --gold-l:#F0D6B6;
  --ice:#9FD3EC;
  --paper:#F4EDE6;

  --font-display:"Smiley Sans","Hiragino Sans GB","PingFang SC","Noto Sans SC",
                 "Microsoft YaHei",sans-serif;
  --font-ui:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-mono:"SF Mono",Menlo,"Avenir Next",ui-monospace,"Courier New",monospace;

  --pad:clamp(18px,5vw,44px);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---------- 舞台 ---------- */
.stage{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  overflow:hidden;
  isolation:isolate;
}
.stage__bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:58% 44%;
  z-index:-4;
  transform:scale(1.04);
  will-change:transform;
}
/* 压暗 + 紫色调，保证文字可读 */
.stage::before{
  content:"";
  position:absolute;inset:0;z-index:-3;
  background:
    radial-gradient(58% 34% at 50% 46%, rgba(5,3,8,.82) 0%, rgba(5,3,8,.55) 45%, rgba(5,3,8,0) 100%),
    radial-gradient(120% 85% at 50% 42%, rgba(5,3,8,0) 0%, rgba(5,3,8,.35) 55%, rgba(5,3,8,.86) 100%),
    linear-gradient(180deg, rgba(5,3,8,.72) 0%, rgba(5,3,8,.20) 26%, rgba(5,3,8,.30) 58%, rgba(5,3,8,.92) 100%),
    linear-gradient(92deg, rgba(59,34,123,.42) 0%, rgba(59,34,123,0) 55%);
}
/* 极细网格：赛博骨架，不喧哗 */
.stage__grid{
  position:absolute;inset:0;z-index:-2;
  pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(199,155,110,.14) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(199,155,110,.10) 1px, transparent 1px);
  background-size:96px 96px;
  mask-image:radial-gradient(120% 90% at 50% 40%, #000 8%, transparent 72%);
  -webkit-mask-image:radial-gradient(120% 90% at 50% 40%, #000 8%, transparent 72%);
  opacity:.7;
}
/* 颗粒 */
.stage__grain{
  position:absolute;inset:-40%;z-index:-1;
  pointer-events:none;opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  animation:grainShift 6s steps(3,end) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0)}
  33%{transform:translate(-2%,1%)}
  66%{transform:translate(1%,-2%)}
  100%{transform:translate(0,0)}
}

/* ---------- 顶部牌匾 ---------- */
.rail{
  position:relative;
  padding:calc(var(--pad) * .75) var(--pad);
  padding-top:calc(var(--pad) * .75 + env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.rail--top{border-bottom:1px solid rgba(199,155,110,.16)}
.rail--top::after{
  content:"";
  position:absolute;left:var(--pad);bottom:-1px;
  width:44px;height:1px;background:var(--gold);
}
.brands{
  display:flex;align-items:center;gap:14px;
  min-width:0;
}
.brands__logo{
  display:block;height:30px;width:auto;
  filter:drop-shadow(0 0 12px rgba(5,3,8,.75));
}
.brands__logo--ts{height:30px;opacity:.96}
.brands__logo--pg{height:26px;opacity:.9}
.brands__sep{
  width:1px;height:20px;
  background:linear-gradient(180deg,transparent,rgba(199,155,110,.5),transparent);
  flex:none;
}
.meta{
  font-family:var(--font-mono);
  font-size:10px;
  line-height:1.6;
  letter-spacing:.14em;
  text-align:right;
  color:rgba(244,237,230,.58);
  white-space:nowrap;
}
.meta b{color:var(--gold-l);font-weight:500;letter-spacing:.1em}

/* 桌面两侧竖排刻度：给宽屏一点结构，不抢主角 */
.edge{
  display:none;
  position:absolute;
  top:50%;
  z-index:4;
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.42em;
  color:rgba(199,155,110,.42);
  white-space:nowrap;
  pointer-events:none;
}
.edge--l{left:calc(var(--pad) * .5);transform:translateY(-50%);writing-mode:vertical-rl}
.edge--r{right:calc(var(--pad) * .5);transform:translateY(-50%);writing-mode:vertical-rl}

/* 桌面两侧竖排刻度：给宽屏一点结构，不抢主角 */
.edge{
  display:none;
  position:absolute;
  top:50%;
  z-index:4;
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.42em;
  color:rgba(199,155,110,.42);
  white-space:nowrap;
  pointer-events:none;
}
.edge--l{left:calc(var(--pad) * .5);transform:translateY(-50%);writing-mode:vertical-rl}
.edge--r{right:calc(var(--pad) * .5);transform:translateY(-50%);writing-mode:vertical-rl}

/* ---------- 中央 ---------- */
.hero{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
  padding:calc(var(--pad) * .5) var(--pad) calc(var(--pad) * .8);
  text-align:center;
}
.hero__kicker{
  margin:0 0 clamp(14px,3.6vw,26px);
  font-size:clamp(10px,2.5vw,12px);
  line-height:1.9;
  letter-spacing:.16em;
  color:rgba(244,237,230,.56);
}
.hero__kicker span{display:block;white-space:nowrap}
.hero__kicker i{
  font-style:normal;color:var(--gold);opacity:.9;
  padding:0 .5em;
}

/* 字标 */
.wordmark{
  position:relative;
  margin:0;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(3.3rem,19vw,11rem);
  line-height:.92;
  letter-spacing:.02em;
  white-space:nowrap;
  transform:skewX(-6deg);
  filter:drop-shadow(0 12px 34px rgba(0,0,0,.55));
}
.wordmark__base{
  position:relative;z-index:2;
  display:inline-block;
  background:linear-gradient(176deg,#FDF3E4 0%,#EBC9A2 34%,#CFA173 58%,#8E6B49 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  -webkit-text-stroke:.7px rgba(253,235,212,.30);
}
.wordmark::before,
.wordmark::after{
  content:attr(data-text);
  position:absolute;left:0;top:0;
  z-index:1;
  font:inherit;letter-spacing:inherit;
  pointer-events:none;
}
.wordmark::before{color:#7C5CE0;opacity:.50;transform:translate(-2px,2px)}
.wordmark::after{color:#5FC6EC;opacity:.22;transform:translate(2px,-2px)}

/* 划过字标的一道扫描光 */
.wordmark__scan{
  position:absolute;left:-12%;right:-12%;top:0;
  height:100%;
  z-index:3;
  pointer-events:none;
  mix-blend-mode:screen;
  background:linear-gradient(180deg,transparent 44%,rgba(255,240,220,.30) 50%,transparent 56%);
  background-size:100% 320%;
  animation:scan 7.5s cubic-bezier(.5,0,.5,1) infinite;
  opacity:.55;
}
@keyframes scan{
  0%,100%{background-position:0 -80%}
  50%{background-position:0 180%}
}

.hero__latin{
  margin:clamp(10px,2.6vw,16px) 0 0;
  font-family:var(--font-mono);
  font-size:clamp(9px,2.3vw,11.5px);
  letter-spacing:.52em;
  text-indent:.52em;
  color:var(--gold);
  opacity:.92;
}

/* 细线：把标题块"框"进一个技术感的位置，替代多余装饰 */
.rule{
  position:relative;
  width:min(340px,62vw);
  height:1px;
  margin:clamp(18px,3.4vw,26px) 0 0;
  background:linear-gradient(90deg,transparent,rgba(199,155,110,.55),transparent);
}
.rule::after{
  content:"";
  position:absolute;left:50%;top:-2px;
  width:5px;height:5px;
  margin-left:-2.5px;
  background:var(--gold);
  transform:rotate(45deg);
  box-shadow:0 0 10px rgba(199,155,110,.8);
}

.hero__theme{
  margin:clamp(12px,3vw,20px) 0 0;
  font-size:clamp(11.5px,3.1vw,14px);
  letter-spacing:.2em;
  color:rgba(244,237,230,.72);
}
.hero__theme s{
  text-decoration:none;
  font-family:var(--font-mono);
  color:var(--gold);opacity:.7;
  margin-right:1em;
  font-size:.72em;
  letter-spacing:.26em;
  vertical-align:.1em;
}

/* ---------- Play 键 ---------- */
.play{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:14px;
  padding:16px 30px 16px 24px;
  min-height:60px;
  border:1.5px solid rgba(199,155,110,.62);
  border-radius:2px;
  background:rgba(5,3,8,.55);
  color:var(--gold-l);
  text-decoration:none;
  font-family:var(--font-mono);
  font-size:clamp(15px,4vw,17px);
  letter-spacing:.34em;
  text-indent:.34em;
  cursor:pointer;
  overflow:hidden;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  box-shadow:
    0 0 0 1px rgba(5,3,8,.6),
    0 6px 0 -2px rgba(59,34,123,.55),
    0 18px 40px -12px rgba(0,0,0,.8),
    inset 0 1px 0 rgba(253,235,212,.10);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),
             box-shadow .25s ease,
             color .25s ease,
             border-color .25s ease,
             background-color .25s ease;
}
.play__glyph{
  font-size:1.15em;
  transform:translateY(1px);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.play__label{position:relative;z-index:2}
.play__sweep{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(100deg,transparent 20%,rgba(240,214,182,.16) 50%,transparent 80%);
  transform:translateX(-110%);
  transition:transform .7s cubic-bezier(.22,1,.36,1);
}
.play:hover{
  color:#0A0710;
  border-color:var(--gold-l);
  background-color:#E4C4A0;
}
.play:hover .play__sweep{transform:translateX(110%)}
.play:hover .play__glyph{transform:translateX(3px)}
.play:active{
  transform:translateY(3px);
  box-shadow:
    0 0 0 1px rgba(5,3,8,.6),
    0 2px 0 -2px rgba(59,34,123,.55),
    0 8px 20px -10px rgba(0,0,0,.8),
    inset 0 2px 6px rgba(0,0,0,.28);
}
.play:focus-visible{
  outline:2px solid var(--ice);
  outline-offset:4px;
}
.play__hint{
  font-size:10px;
  letter-spacing:.14em;
  color:rgba(244,237,230,.42);
}

.play-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:14px;margin-top:clamp(26px,7vw,46px)}

/* ---------- 底部 ---------- */
.rail--bottom{
  border-top:1px solid rgba(199,155,110,.16);
  align-items:flex-end;
  gap:16px;
}
.place{
  font-size:11px;
  line-height:1.8;
  letter-spacing:.1em;
  color:rgba(244,237,230,.52);
}
.place b{
  display:block;
  font-weight:500;
  font-size:13px;
  letter-spacing:.12em;
  color:rgba(244,237,230,.86);
}
.place--right{text-align:right}
.place--right{text-align:right}
.place span{
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.2em;
  color:rgba(141,122,168,.85);
}
.code{
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.22em;
  color:rgba(141,122,168,.7);
  text-align:right;
  white-space:nowrap;
}
.code em{
  display:inline-block;
  width:6px;height:6px;
  background:var(--ice);
  margin-right:7px;
  vertical-align:middle;
  animation:blink 2.4s steps(1,end) infinite;
  box-shadow:0 0 8px rgba(159,211,236,.7);
}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}

@media (max-width:430px){
  .code{display:none}
}

@media (max-width:430px){
  .code{display:none}
}

/* ---------- 入场编排 ---------- */
.rise{
  opacity:0;
  transform:translateY(14px);
  animation:rise .9s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.08s}
.d2{animation-delay:.22s}
.d3{animation-delay:.46s}
.d4{animation-delay:.58s}
.d5{animation-delay:.72s}
.d6{animation-delay:.9s}

/* ---------- 桌面微调 ---------- */
@media (min-width:768px){
  .brands__logo{height:36px}
  .brands__logo--ts{height:38px}
  .brands__logo--pg{height:32px}
  .meta{font-size:11px}
  .place b{font-size:14px}
  .hero__kicker{letter-spacing:.24em}
}
@media (min-width:1024px){
  .edge{display:block}
}
@media (min-width:1024px){
  .edge{display:block}
}
@media (min-width:1200px){
  .hero{padding-bottom:calc(var(--pad) * .4)}
  .wordmark{letter-spacing:.05em}
}

/* 矮屏（横屏手机 / 小窗） */
@media (max-height:560px) and (orientation:landscape){
  .stage{grid-template-rows:auto 1fr auto}
  .brands__logo{height:22px}
  .wordmark{font-size:clamp(2.6rem,9vh,5rem)}
  .rule{display:none}
  .play{padding:12px 24px;min-height:50px;margin-top:16px}
  .hero__theme{margin-top:8px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .rise{opacity:1;transform:none}
  .stage__grain{display:none}
}
</style>
</head>

<script>
/* 桌面端：指针视差，只给鼠标设备；触摸与 reduced-motion 直接跳过 */
(function(){
  var fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  var calm = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!fine || calm) return;
  var bg = document.querySelector('.stage__bg');
  var tx=0, ty=0, cx=0, cy=0, raf=null;
  function loop(){
    cx += (tx-cx)*0.06;
    cy += (ty-cy)*0.06;
    bg.style.transform = 'scale(1.06) translate3d('+cx.toFixed(2)+'px,'+cy.toFixed(2)+'px,0)';
    raf = Math.abs(tx-cx)>0.1 || Math.abs(ty-cy)>0.1 ? requestAnimationFrame(loop) : null;
  }
  window.addEventListener('pointermove', function(e){
    tx = (e.clientX/window.innerWidth - .5) * -16;
    ty = (e.clientY/window.innerHeight - .5) * -12;
    if(!raf) raf = requestAnimationFrame(loop);
  }, {passive:true});
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04030A">
<title>无限可能的学校 · Try and All is Possible — 2026.12.05</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="description" content="第十三届中国教育创新年会（场外深研）暨清澜山学校第四届创新教育论坛——无限可能的学校。2026 年 12 月 5 日，东莞·清澜山学校。">
<style>
/* ==========================================================
   版本 C · SCANNER（赛博/科幻向）
   底色 ink #04030A · 品牌紫 #3B227B · 金 #C79B6E · 冰蓝 #9FD3EC
   结构：固定取景框 + 全息瞄准环 + 霓虹灯管字标 + 切角街机键 + 数据读数
   无外部依赖；动效全部尊重 prefers-reduced-motion
   ========================================================== */

/* Orbitron —— 美式霓虹/复古未来主义的骨架字体，本地文件，不联网也能开 */
@font-face{
  font-family:"Orbitron";
  src:url("assets/orbitron-500.woff2") format("woff2");
  font-weight:400 600;font-display:block;
}
@font-face{
  font-family:"Orbitron";
  src:url("assets/orbitron-700.woff2") format("woff2");
  font-weight:700;font-display:block;
}
@font-face{
  font-family:"Orbitron";
  src:url("assets/orbitron-900.woff2") format("woff2");
  font-weight:800 900;font-display:block;
}
/* 阿里妈妈数黑体，可免费商用。只嵌入首页这七个字 */
@font-face{
  font-family:"ShuTitle";
  src:url("assets/shuhei-title.woff2") format("woff2");
  font-weight:700;font-display:block;
}

:root{
  --ink:#04030A;
  --violet:#3B227B;
  --violet-l:#6B4EC4;
  --gold:#C79B6E;
  --gold-l:#F0D6B6;
  --ice:#9FD3EC;
  --paper:#F2ECE6;

  --font-display:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif;
  --font-ui:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  /* 美式霓虹的“机器字”：宽字身、方折、方孔，用来承载全部英文与数字 */
  --font-led:"Orbitron","SF Mono",Menlo,ui-monospace,"PingFang SC",monospace;
  --font-mono:"Orbitron","SF Mono",Menlo,ui-monospace,"PingFang SC",monospace;
  /* 全站统一字阶：五页同值。小屏缩放仍由各页 media 单独负责。 */
  --fs-h1:32px;--fs-h2:22px;--fs-lead:16px;--fs-kicker:14px;--fs-small:13px;--fs-note:12px;--fs-deco:9px;
  /* 霓虹两色：灯管粉 + 冰蓝，只在字标与少量信号点出现 */
  --neon:#FF6FB5;
  --neon-hot:#FF2E9A;

  --pad:clamp(16px,4.6vw,42px);
  --px:0;
  --py:0;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--ink);overflow:clip}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-ui);
  overflow:clip;
  overscroll-behavior:none;
}

/* ---------- 背景层 ---------- */
.bg{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.bg__img{
  position:absolute;inset:-4%;
  width:108%;height:108%;
  object-fit:cover;
  object-position:56% 42%;
  filter:saturate(.86) contrast(1.12) brightness(.82);
  transform:
    translate3d(calc(var(--px) * -12px), calc(var(--py) * -10px), 0)
    scale(1.02);
  transition:transform .9s cubic-bezier(.22,1,.36,1);
  will-change:transform;
}

/* 压暗 + 双色染（紫在左下、冰蓝在右上） */
.veil{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(62% 40% at 50% 48%, rgba(4,3,10,.86) 0%, rgba(4,3,10,.52) 48%, rgba(4,3,10,0) 100%),
    radial-gradient(120% 88% at 50% 44%, rgba(4,3,10,.10) 0%, rgba(4,3,10,.42) 56%, rgba(4,3,10,.94) 100%),
    linear-gradient(180deg, rgba(4,3,10,.86) 0%, rgba(4,3,10,.26) 22%, rgba(4,3,10,.30) 56%, rgba(4,3,10,.96) 100%),
    linear-gradient(96deg, rgba(59,34,123,.46) 0%, rgba(59,34,123,0) 52%, rgba(59,34,123,.20) 100%),
    linear-gradient(270deg, rgba(4,3,10,.58) 0%, rgba(4,3,10,.16) 26%, rgba(4,3,10,0) 48%);
}

/* 光晕：让画面“发光”而不靠加亮图片 */
.bloom{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  mix-blend-mode:screen;
  opacity:.55;
  background:
    radial-gradient(38% 22% at 22% 78%, rgba(107,78,196,.30) 0%, rgba(107,78,196,0) 72%),
    radial-gradient(32% 18% at 82% 26%, rgba(159,211,236,.16) 0%, rgba(159,211,236,0) 74%),
    radial-gradient(26% 14% at 50% 52%, rgba(199,155,110,.12) 0%, rgba(199,155,110,0) 76%);
}

/* 透视地网：透视放在外层，网格做 rotateX —— 否则会被压成一条细片 */
.floor{
  position:fixed;
  left:0;right:0;bottom:0;
  height:36vh;
  z-index:4;
  pointer-events:none;
  perspective:820px;
  perspective-origin:50% 0%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 18%,rgba(0,0,0,.55) 46%,transparent 76%);
  mask-image:linear-gradient(to top,#000 0%,#000 18%,rgba(0,0,0,.55) 46%,transparent 76%);
}
.gridfloor{
  position:absolute;
  left:-65%;right:-65%;top:0;bottom:0;
  transform-origin:50% 100%;
  transform:rotateX(66deg);
  opacity:.72;
  background-image:
    linear-gradient(rgba(159,211,236,.62) 1px, transparent 1px),
    linear-gradient(90deg, rgba(159,211,236,.46) 1px, transparent 1px);
  background-size:92px 92px;
  animation:floorRun 9s linear infinite;
}
@keyframes floorRun{
  from{background-position:0 0, 0 0}
  to{background-position:0 92px, 0 0}
}
/* 地平线：给地网一个“尽头” */
.horizon{
  position:fixed;
  left:0;right:0;
  bottom:28vh;
  height:1px;
  z-index:4;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(159,211,236,.45) 20%,rgba(159,211,236,.7) 50%,rgba(159,211,236,.45) 80%,transparent);
  box-shadow:0 0 20px 1px rgba(159,211,236,.20), 0 0 54px 6px rgba(107,78,196,.14);
  opacity:.45;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
}

/* 底栏压暗：地网可以穿过，但不能影响读数 */
.scrim{
  position:fixed;
  left:0;right:0;bottom:0;
  height:20vh;
  z-index:6;
  pointer-events:none;
  background:linear-gradient(to top, rgba(4,3,10,.88) 0%, rgba(4,3,10,.70) 32%, rgba(4,3,10,.34) 62%, rgba(4,3,10,0) 100%);
}

/* 底栏压暗：地网可以穿过，但不能影响读数 */
.scrim{
  position:fixed;
  left:0;right:0;bottom:0;
  height:20vh;
  z-index:6;
  pointer-events:none;
  background:linear-gradient(to top, rgba(4,3,10,.88) 0%, rgba(4,3,10,.70) 32%, rgba(4,3,10,.34) 62%, rgba(4,3,10,0) 100%);
}

/* 粒子场 */
.fx{
  position:fixed;inset:0;
  width:100%;height:100%;
  z-index:1;
  pointer-events:none;
}

/* 扫描线 + 行扫 */
.scan{
  position:fixed;inset:0;z-index:20;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.030) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
  opacity:.55;
}
.scan::after{
  content:"";
  position:absolute;left:0;right:0;top:-30vh;
  height:30vh;
  background:linear-gradient(180deg,transparent,rgba(159,211,236,.07) 60%,rgba(159,211,236,.16) 96%,transparent);
  animation:scanSweep 6.5s cubic-bezier(.45,0,.55,1) infinite;
}
@keyframes scanSweep{
  0%{transform:translateY(0)}
  100%{transform:translateY(160vh)}
}

/* ---------- 取景框 ---------- */
.frame{
  position:fixed;inset:0;z-index:30;pointer-events:none;
}
.frame__line{
  position:absolute;inset:9px;
  border:1px solid rgba(199,155,110,.13);
}
.frame__c{
  position:absolute;
  width:20px;height:20px;
  border:1px solid rgba(199,155,110,.62);
}
.frame__c--tl{top:9px;left:9px;border-right:0;border-bottom:0}
.frame__c--tr{top:9px;right:9px;border-left:0;border-bottom:0}
.frame__c--bl{bottom:9px;left:9px;border-right:0;border-top:0}
.frame__c--br{bottom:9px;right:9px;border-left:0;border-top:0}
/* 框上刻度 */
.frame__ticks{
  position:absolute;left:0;right:0;bottom:9px;height:1px;
  background:repeating-linear-gradient(90deg,rgba(199,155,110,.42) 0 1px,transparent 1px 26px);
  opacity:.5;
}

/* ---------- 舞台 ---------- */
.stage{
  position:relative;
  z-index:10;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:
    calc(var(--pad) * .9 + env(safe-area-inset-top))
    calc(var(--pad) + 8px)
    calc(var(--pad) * 1.05 + env(safe-area-inset-bottom));
}

/* ---------- 顶栏 ---------- */
/* 左上：两枚合作方 logo 左对齐上下叠放；右上：清澜山学校完整 lockup */
.hud--top{
  position:relative;
  z-index:20;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:start;
  gap:clamp(8px,2vw,16px);
}
.hud--top .brands{grid-column:1;justify-self:start}
.hud--top .brands__logo--ts{grid-column:2;justify-self:end}
.brands{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:clamp(7px,1.9vw,11px);
  min-width:0;
}
.brands__logo{
  display:block;
  width:auto;height:auto;
  filter:drop-shadow(0 0 12px rgba(4,3,10,.88));
  user-select:none;
  -webkit-user-drag:none;
}
/* 论坛主视觉在上，年会 lockup 在下，宽度收一档形成台阶，视觉重量才平衡 */
.brands__logo--forum{width:clamp(108px,42vw,320px)}
.brands__logo--pgy{width:clamp(88px,34vw,262px);opacity:.94}
/* 学校 lockup 顶到右上角，右边缘与取景框同一条线 */
.brands__logo--ts{
  flex:none;
  width:clamp(78px,30vw,252px);
  opacity:.97;
}

/* ---------- 中央 ---------- */
.core{
  /* 七个方头字横排。手机上加大一档，仍按字宽留出左右边 */
  --tfs:clamp(2rem,12.6vw,6.6rem);
  --lw:min(92vw,1040px);      /* 字标显示宽度：七字横排，比四字宽得多 */
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:clamp(10px,3vw,22px) 0;
  isolation:isolate;
}
/* 字标底下的冷光，让金属字“被照亮”而不是贴上去 */
.core::before{
  content:"";
  position:absolute;
  left:50%;top:41%;
  width:calc(var(--lw) * 1.10);
  height:calc(var(--lw) * .34);
  transform:translate(-50%,-50%);
  z-index:-2;
  pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, rgba(159,211,236,.13) 0%, rgba(107,78,196,.12) 42%, rgba(4,3,10,0) 78%);
}

/* 全息瞄准环：直径跟字标字号绑定，任何尺寸下比例一致 */
.ret{
  position:absolute;
  left:50%;top:41%;
  width:calc(var(--lw) * 1.06);
  height:auto;
  transform:
    translate3d(calc(-50% + var(--px) * 9px), calc(-50% + var(--py) * 7px), 0);
  transition:transform 1s cubic-bezier(.22,1,.36,1);
  z-index:-1;
  opacity:1;
  pointer-events:none;
}
.ret__spin{
  transform-box:view-box;
  transform-origin:center;
  animation:spin 44s linear infinite;
}
.ret__spin--rev{animation:spin 30s linear infinite reverse}
.ret__spin--fast{animation:spin 11s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}


/* 字标：方头灯管。白热芯 + 冰蓝管壁，粉红在左、冰蓝在右各偏一笔 */
.title{
  position:relative;
  display:block;
  margin:clamp(10px,2.2vw,22px) 0 0;
  font-family:"ShuTitle","PingFang SC","Hiragino Sans GB","Heiti SC",sans-serif;
  font-size:var(--tfs);
  font-weight:700;
  line-height:1;
  letter-spacing:.04em;
  white-space:nowrap;
  text-rendering:geometricPrecision;
}
.title span{display:block}

/* ---------- 流线字标：用户设计的七字弧线排布（无限可沿弧、能下落、的学校横排）。
   透明 PNG 白芯粉边直接上图；glow 层用同一张图 blur 出霓虹呼吸，仍是合成器动画。 ---------- */
.title--flow{
  font-size:0;line-height:0;letter-spacing:0;white-space:normal;
  width:min(88vw,620px);margin-left:auto;margin-right:auto;
}
.title__flow{
  display:block;width:100%;height:auto;position:relative;z-index:2;
}
.title__flow-glow{
  position:absolute;inset:0;width:100%;height:auto;z-index:0;
  filter:blur(14px) saturate(1.6) brightness(1.15);
  opacity:.65;pointer-events:none;user-select:none;
  animation:neonBreath 3.6s ease-in-out infinite;
}
@media (prefers-reduced-motion:reduce){
  .title__flow-glow{animation:none}
}
@media (max-height:680px){
  .title--flow{width:min(76vw,520px)}
}
.title__glow,
.title__tube{
  position:absolute;
  inset:0;
  pointer-events:none;
  user-select:none;
}
.title__glow{
  z-index:0;
  color:#FF6FB5;
  filter:blur(.16em);
  opacity:.7;
  animation:neonBreath 3.6s ease-in-out infinite;
}
.title__tube{z-index:1;color:transparent;opacity:.9}
.title__tube--pink{
  -webkit-text-stroke:.045em #FF6FB5;
  transform:translate(-.06em,0);
}
.title__tube--ice{
  -webkit-text-stroke:.045em #9FD3EC;
  transform:translate(.06em,0);
}
.title__base{
  position:relative;
  z-index:2;
  color:#F7FEFF;
  -webkit-text-stroke:.028em #9FD3EC;
  paint-order:stroke fill;
  text-shadow:
    0 0 .06em #fff,
    0 0 .18em #9FD3EC,
    0 0 .42em #FF6FB5,
    0 0 .7em rgba(255,46,154,.55);
}
@keyframes neonBreath{
  0%,100%{opacity:.62}
  50%{opacity:.95}
}

/* 字标下方的 slogan 线：这句是品牌主标语，给足分量，别读成技术标签 */
.spec{
  display:flex;
  align-items:center;
  gap:clamp(10px,2.6vw,16px);
  width:min(440px,86vw);
  margin:clamp(18px,4.4vw,28px) 0 0;
  font-family:var(--font-mono);
  font-size:clamp(10px,2.9vw,13px);
  font-weight:600;
  letter-spacing:.2em;
  color:rgba(244,234,240,.92);
  text-shadow:0 0 18px rgba(255,111,181,.34),0 1px 0 rgba(4,3,10,.75);
  white-space:nowrap;
}
.spec i{
  flex:1;height:1.5px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,79,163,0),rgba(255,79,163,.75) 35%,rgba(255,214,236,.95) 50%,rgba(159,211,236,.75) 65%,rgba(159,211,236,0));
  box-shadow:0 0 8px rgba(255,79,163,.55),0 0 18px rgba(159,211,236,.30);
}
/* 切角街机键 */
.play-wrap{
  display:inline-block;
  margin-top:clamp(28px,7vw,44px);
  filter:drop-shadow(0 0 26px rgba(199,155,110,.34));
}
.play{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  min-height:62px;
  padding:0 clamp(34px,9vw,54px);
  text-decoration:none;
  color:#150C06;
  background:linear-gradient(178deg,#FFF1DC 0%,#F0D6B6 38%,#C79B6E 100%);
  clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
.play b{
  font-family:var(--font-mono);
  font-size:clamp(15px,4.4vw,18px);
  font-weight:700;
  letter-spacing:.22em;
  text-indent:.34em;
  line-height:1;
}
.play__tri{
  width:0;height:0;
  border-left:8px solid #150C06;
  border-top:5.5px solid transparent;
  border-bottom:5.5px solid transparent;
  margin-left:-2px;
}
/* 键面上的细扫描 */
.play::after{
  content:"";
  position:absolute;left:0;right:0;top:0;
  height:46%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),transparent);
  opacity:.5;
  pointer-events:none;
}
/* 掠过的高光 */
.play::before{
  content:"";
  position:absolute;
  top:-60%;bottom:-60%;left:-40%;
  width:34%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
  transform:rotate(18deg);
  animation:sheen 4.6s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes sheen{
  0%,62%{left:-45%}
  100%{left:130%}
}
.play:active{transform:translateY(1px)}
.play:focus-visible{
  outline:2px solid var(--ice);
  outline-offset:6px;
}
/* 按钮外的虚线角 */
.play-wrap::before,
.play-wrap::after{
  content:"";
  position:absolute;
  width:9px;height:9px;
  border:1px solid rgba(159,211,236,.75);
  pointer-events:none;
}
.play-wrap{position:relative}
.play-wrap::before{left:-9px;top:-9px;width:11px;height:11px;border-right:0;border-bottom:0}
.play-wrap::after{right:-9px;bottom:-9px;width:11px;height:11px;border-left:0;border-top:0}

.tip{
  margin:clamp(15px,3.6vw,20px) 0 0;
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.1em;
  color:rgba(242,236,230,.7);
}

/* ---------- 底栏读数 ---------- */
.hud--bottom{
  display:grid;
  gap:8px;
}
.data{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  padding-top:11px;
  border-top:1px solid rgba(199,155,110,.16);
}
.data__i{
  min-width:0;
  padding-left:8px;
  border-left:1px solid rgba(159,211,236,.16);
}
.data__i:first-child{padding-left:0;border-left:0}
.data__k{
  display:block;
  font-family:var(--font-ui);font-weight:600;
  font-size:var(--fs-note);
  letter-spacing:.08em;
  color:rgba(159,211,236,.78);
  margin-bottom:4px;
  text-transform:uppercase;
}
.data__v{
  display:block;
  font-size:clamp(12px,3vw,13px);
  letter-spacing:.06em;
  color:rgba(242,236,230,.9);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.data__i:nth-child(2) .data__v{
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  letter-spacing:.02em;
  line-height:1.35;
}
.data__v small{
  font-family:var(--font-mono);
  font-size:.82em;
  letter-spacing:.08em;
  color:rgba(199,155,110,.8);
}
/* 快捷通道：切角金键是主铭牌。字右侧的实心箭头指向一条金线路径；
   背景—日程、日程—工作坊用横杠连起来，不套外框，也不做成下划线导航。 */
.gate{
  --key-h:30px;
  display:flex;
  flex-flow:row nowrap;
  align-items:center;
  justify-content:center;
  width:100%;
  min-width:0;
  gap:clamp(10px,2.4vw,18px);
  padding:8px 4px 2px;
}
.gate__tag{
  position:relative;
  flex:none;
  margin:0;
  filter:drop-shadow(0 0 12px rgba(199,155,110,.28));
}
.gate__key{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:var(--key-h);
  padding:0 11px 0 12px;
  color:#150C06;
  font-family:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif;
  font-size:var(--fs-note);
  font-weight:700;
  letter-spacing:.1em;
  line-height:1;
  white-space:nowrap;
  background:linear-gradient(178deg,#FFF1DC 0%,var(--gold-l) 38%,var(--gold) 100%);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:transform .08s linear;
}
.gate__tag:active .gate__key{transform:translateY(4px)}
.gate__ico{width:16px;height:16px;flex:none;display:block;color:#150C06}
.gate__tag::before,
.gate__tag::after{
  content:"";
  position:absolute;
  width:7px;height:7px;
  border:1px solid rgba(159,211,236,.75);
  pointer-events:none;
}
.gate__tag::before{left:-7px;top:-7px;border-right:0;border-bottom:0}
.gate__tag::after{right:-7px;bottom:-7px;border-left:0;border-top:0}
.dock{
  display:flex;
  flex-flow:row nowrap;
  align-items:center;
  justify-content:center;
  width:auto;
  min-width:0;
  gap:0;
  padding:0;
}
.dock a{
  position:relative;
  display:inline-flex;
  align-items:center;
  flex:none;
  min-height:44px;
  padding:0 2px;
  color:rgba(242,236,230,.92);
  font-family:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif;
  font-size:14px;
  font-weight:500;
  letter-spacing:.04em;
  line-height:1;
  white-space:nowrap;
  text-decoration:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.dock__bar{
  flex:none;
  width:clamp(16px,4.5vw,28px);
  height:2px;
  margin-inline:clamp(5px,1.3vw,10px);
  background:linear-gradient(90deg,rgba(199,155,110,.28),var(--gold) 22%,var(--gold-l) 50%,var(--gold) 78%,rgba(199,155,110,.28));
  opacity:.72;
  transform:scaleY(1);
  transform-origin:center;
  pointer-events:none;
  transition:opacity .14s linear, transform .14s linear;
}
.dock a:active{color:#FFD9A8;text-shadow:0 0 10px rgba(255,217,168,.45)}
.dock a:focus{outline:none}
.dock a:focus-visible{outline:1px solid rgba(255,217,168,.85);outline-offset:3px}
.dock a:active + .dock__bar,
.dock__bar:has(+ a:active),
.dock a:focus-visible + .dock__bar,
.dock__bar:has(+ a:focus-visible){
  opacity:1;
  transform:scaleY(2);
  background:linear-gradient(90deg,var(--gold),var(--gold-l) 50%,var(--gold));
}
@media (hover:hover) and (pointer:fine){
  .dock a:hover{color:#FFD9A8;text-shadow:0 0 10px rgba(255,217,168,.45)}
  .dock a:hover + .dock__bar,
  .dock__bar:has(+ a:hover){
    opacity:1;
    transform:scaleY(2);
    background:linear-gradient(90deg,var(--gold),var(--gold-l) 50%,var(--gold));
  }
}

/* ---------- 入场 ---------- */
.in{opacity:0;transform:translateY(12px);animation:bootIn .9s cubic-bezier(.22,1,.36,1) forwards}
.in1{animation-delay:.10s}
.in3{animation-delay:.30s}
.in4{animation-delay:.42s}
.in5{animation-delay:.54s}
.in6{animation-delay:.66s}
@keyframes bootIn{to{opacity:1;transform:none}}

/* ---------- 桌面增强 ---------- */
@media (min-width:900px){
  .core{--tfs:clamp(4.2rem,9vw,8.2rem)}
  .play{min-height:68px;padding:0 62px}
  .play b{font-size:19px;letter-spacing:.4em;text-indent:.4em}
  .data{max-width:760px}
  .hud--bottom{justify-items:center}
  .data{width:100%}
}

/* 两侧竖排信息：宽屏才出现，给画面一个“仪表”感 */
.rail{
  display:none;
  position:fixed;
  top:50%;
  z-index:12;
  font-family:var(--font-mono);
  font-size:8px;
  letter-spacing:.34em;
  color:rgba(159,211,236,.32);
  white-space:nowrap;
  writing-mode:vertical-rl;
  transform:translateY(-50%);
  pointer-events:none;
}
.rail--l{left:14px}
.rail--r{right:14px}
@media (min-width:1180px){
  .rail{display:block}
}

/* ---------- 矮屏收紧 ---------- */
/* 窄屏：Orbitron 比等宽字宽，小屏要再收一档 */
@media (max-width:380px){
  .tip{font-size:10px;letter-spacing:.08em}
  .spec{letter-spacing:.14em}
  .gate{--key-h:28px;gap:8px;padding:6px 0 1px}
  .gate__key{padding:0 8px 0 9px;font-size:11px;letter-spacing:.04em;gap:4px}
  .gate__ico{width:15px;height:15px}
  .dock__bar{width:12px;margin-inline:3px}
  .dock a{font-size:13px;padding:0 1px}
}
@media (max-height:680px){
  .play-wrap{margin-top:16px}
  .spec{margin-top:11px}
  .title{margin-top:8px}
  .tip{margin-top:11px}
  .core{--tfs:clamp(1.85rem,11.8vw,5.6rem);--lw:min(80vw,860px)}
  .data{padding-top:8px}
  /* 矮屏把合作方 lockup 整体收一档，别跟字标抢高度 */
  .brands{gap:6px}
  .brands__logo--forum{width:clamp(112px,34vw,250px)}
  .brands__logo--pgy{width:clamp(92px,27vw,204px)}
  .brands__logo--ts{width:clamp(84px,24vw,184px)}
}
/* 短屏（iPhone SE2/8 的 667、安卓 640 这一档）：再收一档，别让底部被切 */
@media (max-height:760px){
  .play{min-height:56px}
  .play b{font-size:15px}
}
@media (max-height:640px){
  .core{--tfs:clamp(1.7rem,10.8vw,4.8rem);--lw:min(74vw,760px)}
  .play-wrap{margin-top:13px}
  .tip{margin-top:9px}
  .hud--bottom{gap:4px}
  .gate{--key-h:28px;gap:8px;padding:6px 0 0}
  .gate__key{padding:0 8px 0 9px;font-size:11px;letter-spacing:.04em;gap:4px}
  .gate__ico{width:15px;height:15px}
  .dock__bar{width:12px;margin-inline:3px}
  .dock a{font-size:13px;padding:0 1px}
}

/* ---------- 降低动效 ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .in{opacity:1;transform:none}
  .title__glow{animation:none;opacity:.8}
  .scan::after{display:none}
  .gridfloor{animation:none}
}
</style>
</head>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canHover = window.matchMedia('(hover:hover) and (pointer:fine)').matches;

  /* 视差：只给有鼠标的设备，幅度很小，不干扰阅读 */
  if(!reduce && canHover){
    var raf = 0, tx = 0, ty = 0;
    window.addEventListener('pointermove', function(e){
      tx = (e.clientX / window.innerWidth - .5);
      ty = (e.clientY / window.innerHeight - .5);
      if(raf) return;
      raf = requestAnimationFrame(function(){
        document.documentElement.style.setProperty('--px', tx.toFixed(3));
        document.documentElement.style.setProperty('--py', ty.toFixed(3));
        raf = 0;
      });
    }, {passive:true});
  }

  /* 粒子场：金与冰蓝两种尘埃，缓慢上升 */
  var cvs = document.getElementById('fx');
  if(!cvs) return;
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, dpr = 1, ps = [], streaks = [];

  function seed(){
    var n = W < 520 ? 42 : (W < 1000 ? 74 : 110);
    ps = [];
    for(var i = 0; i < n; i++){
      var ice = Math.random() > .62;
      ps.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + .35,
        vy: -(Math.random() * .16 + .04),
        vx: (Math.random() - .5) * .09,
        a: Math.random() * .42 + .12,
        ph: Math.random() * 6.283,
        sp: Math.random() * .9 + .5,
        c: ice ? '159,211,236' : '199,155,110'
      });
    }
    streaks = [];
    for(var k = 0; k < (W < 520 ? 2 : 4); k++){
      streaks.push({y: Math.random() * H, x: Math.random() * W * .4, len: Math.random() * 90 + 50, sp: Math.random() * .5 + .35});
    }
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }

  function draw(t){
    ctx.clearRect(0, 0, W, H);

    /* 横向信号条 */
    for(var s = 0; s < streaks.length; s++){
      var st = streaks[s];
      st.x += st.sp;
      if(st.x > W + st.len) { st.x = -st.len; st.y = Math.random() * H; }
      var g = ctx.createLinearGradient(st.x, 0, st.x + st.len, 0);
      g.addColorStop(0, 'rgba(159,211,236,0)');
      g.addColorStop(.72, 'rgba(159,211,236,.10)');
      g.addColorStop(1, 'rgba(159,211,236,.30)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(st.x, st.y);
      ctx.lineTo(st.x + st.len, st.y);
      ctx.stroke();
    }

    /* 尘埃 */
    for(var i = 0; i < ps.length; i++){
      var p = ps[i];
      p.y += p.vy;
      p.x += p.vx;
      if(p.y < -6){ p.y = H + 6; p.x = Math.random() * W; }
      if(p.x < -6) p.x = W + 6;
      if(p.x > W + 6) p.x = -6;
      var tw = .55 + .45 * Math.sin(t * .001 * p.sp + p.ph);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + p.c + ',' + (p.a * tw).toFixed(3) + ')';
      ctx.fill();
    }

    if(!reduce) requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize', function(){ resize(); draw(0); }, {passive:true});
  draw(0);
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050308">
<title>无限游戏 · LEVEL 01 — 2026.12.05</title>
<meta name="description" content="第十三届中国教育创新年会（场外深研）暨清澜山学校第四届创新教育论坛，2026 年 12 月 5 日，东莞·清澜山学校。">
<style>
/* ============ 版本 B · LOADING SCREEN ============
   同一套底色与金色，换成"游戏机加载页"的结构：
   外框 + 四角括号 + 顶栏状态 + 进度条 + 街机按键 + 底部关卡路线
   字标为描边重影 + 偶发横向切片，克制到约每 7 秒一次
   =============================================== */

/* 若日后下载了得意黑，把字体文件放进 assets/ 即可自动生效 */
@font-face{
  font-family:"Smiley Sans";
  src:url("assets/SmileySans-Oblique.woff2") format("woff2");
  font-weight:400 700;
  font-display:swap;
}

:root{
  --ink:#050308;
  --violet-deep:#3B227B;
  --muted:#8D7AA8;
  --gold:#C79B6E;
  --gold-l:#F0D6B6;
  --ice:#9FD3EC;
  --paper:#F4EDE6;

  --font-display:"Smiley Sans","Hiragino Sans GB","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-ui:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-mono:"SF Mono",Menlo,"Avenir Next",ui-monospace,monospace;

  --inset:clamp(10px,2.6vw,22px);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

.wrap{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  overflow:hidden;
  isolation:isolate;
}

/* ---------- 背景 ---------- */
.wrap__bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:66% 40%;
  z-index:-5;
  transform:scale(1.06);
  filter:contrast(1.06) saturate(.92) brightness(.9);
}
.veil{
  position:absolute;inset:0;z-index:-4;
  background:
    radial-gradient(42% 30% at 50% 46%, rgba(5,3,8,.88) 0%, rgba(5,3,8,.45) 60%, rgba(5,3,8,0) 100%),
    linear-gradient(180deg, rgba(5,3,8,.88) 0%, rgba(5,3,8,.30) 30%, rgba(5,3,8,.45) 62%, rgba(5,3,8,.94) 100%),
    linear-gradient(100deg, rgba(59,34,123,.55) 0%, rgba(59,34,123,.05) 60%);
}
.grid{
  position:absolute;inset:0;z-index:-3;
  pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(199,155,110,.16) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(199,155,110,.11) 1px, transparent 1px);
  background-size:76px 76px;
  background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(115% 80% at 50% 46%, #000 0%, rgba(0,0,0,.35) 62%, transparent 92%);
  mask-image:radial-gradient(115% 80% at 50% 46%, #000 0%, rgba(0,0,0,.35) 62%, transparent 92%);
}
.scanlines{
  position:absolute;inset:0;z-index:-2;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.03) 0px,
    rgba(255,255,255,.03) 1px,
    transparent 1px,
    transparent 3px);
  opacity:.6;
  animation:lineDrift 12s linear infinite;
}
@keyframes lineDrift{to{background-position:0 60px}}

/* ---------- 外框 ---------- */
.frame{
  position:absolute;
  inset:var(--inset);
  z-index:1;
  pointer-events:none;
  border:1px solid rgba(199,155,110,.20);
}
.frame i{
  position:absolute;
  width:14px;height:14px;
  border:1px solid rgba(240,214,182,.7);
}
.frame i:nth-child(1){left:-1px;top:-1px;border-right:0;border-bottom:0}
.frame i:nth-child(2){right:-1px;top:-1px;border-left:0;border-bottom:0}
.frame i:nth-child(3){left:-1px;bottom:-1px;border-right:0;border-top:0}
.frame i:nth-child(4){right:-1px;bottom:-1px;border-left:0;border-top:0}
.frame span{position:absolute;background:rgba(199,155,110,.35)}
.frame span:nth-of-type(1){left:50%;top:-1px;width:1px;height:7px}
.frame span:nth-of-type(2){left:50%;bottom:-1px;width:1px;height:7px}
.frame span:nth-of-type(3){top:50%;left:-1px;height:1px;width:7px}
.frame span:nth-of-type(4){top:50%;right:-1px;height:1px;width:7px}

/* ---------- 顶栏 ---------- */
.bar{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:calc(var(--inset) + 10px) calc(var(--inset) + 12px);
  font-family:var(--font-mono);
  font-size:9.5px;
  letter-spacing:.18em;
  color:rgba(244,237,230,.6);
}
.bar--top{border-bottom:1px solid rgba(199,155,110,.14)}
.bar__group{display:flex;align-items:center;gap:9px}
.bar b{color:var(--gold-l);font-weight:500}
.bar em{font-style:normal;color:rgba(141,122,168,.9)}
.marks{display:flex;align-items:center;gap:12px;min-width:0}
.marks img{display:block;filter:drop-shadow(0 0 10px rgba(5,3,8,.8))}
.marks__ts{height:26px;width:auto}
.marks__pgy{height:22px;width:auto;opacity:.92}
.marks__sep{
  width:1px;height:16px;flex:none;
  background:linear-gradient(180deg,transparent,rgba(199,155,110,.55),transparent);
}

/* ---------- 主区 ---------- */
.core{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0 calc(var(--inset) + 16px);
  text-align:center;
}
.core__tag{
  margin:0 0 clamp(16px,4vw,26px);
  font-family:var(--font-mono);
  font-size:9.5px;
  letter-spacing:.2em;
  line-height:2;
  color:rgba(244,237,230,.5);
}
.core__tag span{display:block;white-space:nowrap}
.core__tag i{font-style:normal;color:var(--gold);padding:0 .4em}

/* 字标 */
.logo{
  position:relative;
  margin:0;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(3rem,14.5vw,9.4rem);
  line-height:.94;
  letter-spacing:.03em;
  white-space:nowrap;
  transform:skewX(-8deg);
}
.logo__face{
  position:relative;
  display:inline-block;
  z-index:3;
  background:linear-gradient(172deg,#FFF8EE 0%,#EFD3AE 40%,#C89E72 72%,#7E5C3D 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  filter:drop-shadow(0 10px 28px rgba(0,0,0,.6));
}
.logo__ghost{
  position:absolute;
  left:0;top:0;
  z-index:1;
  color:transparent;
  -webkit-text-stroke:.8px rgba(147,116,214,.42);
  transform:translate(5px,-3px);
}
.logo__ghost--2{
  -webkit-text-stroke:.8px rgba(159,211,236,.16);
  transform:translate(-4px,2px);
  z-index:0;
}
.logo__slice{
  position:absolute;
  left:0;top:0;
  z-index:4;
  color:#F6E3C8;
  clip-path:inset(38% 0 52% 0);
  opacity:0;
  transform:translateX(-7px);
  animation:glitch 7.4s steps(1,end) infinite;
}
@keyframes glitch{
  0%,88%{opacity:0;transform:translateX(-7px)}
  89%{opacity:.9;transform:translateX(6px)}
  90.5%{opacity:0}
  92%{opacity:.7;transform:translateX(-4px)}
  93.5%{opacity:0}
}

/* 副标题 */
.core__sub{
  margin:clamp(20px,4.6vw,28px) 0 0;
  font-family:var(--font-mono);
  font-size:clamp(9px,2.4vw,11px);
  letter-spacing:.34em;
  line-height:1.9;
  color:rgba(199,155,110,.75);
}
.core__sub b{
  display:block;
  margin-top:2px;
  font-family:var(--font-ui);
  font-size:clamp(12.5px,3.3vw,15px);
  font-weight:400;
  letter-spacing:.16em;
  color:rgba(244,237,230,.86);
}

/* 进度条 */
.load{
  width:min(230px,56vw);
  margin:clamp(24px,5.5vw,34px) 0 0;
  display:flex;
  align-items:center;
  gap:10px;
}
.load__track{
  position:relative;
  flex:1;
  height:3px;
  background:rgba(199,155,110,.22);
  box-shadow:inset 0 0 0 1px rgba(199,155,110,.12);
  overflow:hidden;
}
.load__track::after{
  content:"";
  position:absolute;inset:0;
  background-image:linear-gradient(90deg,rgba(5,3,8,.9) 1px,transparent 1px);
  background-size:calc(100% / 8) 100%;
  opacity:.5;
}
.load__fill{
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(199,155,110,.5),var(--gold-l));
  transform-origin:left;
  transform:scaleX(0);
  animation:fill 1.8s .35s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes fill{to{transform:scaleX(1)}}
.load__txt{
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:.2em;
  color:var(--gold);
  white-space:nowrap;
}

/* ---------- 街机按键 ---------- */
.key{
  position:relative;
  margin-top:clamp(22px,5vw,32px);
  display:inline-flex;
  align-items:center;
  gap:16px;
  padding:0 30px 0 26px;
  height:66px;
  border:1.5px solid var(--gold);
  background:linear-gradient(180deg,rgba(59,34,123,.42),rgba(5,3,8,.72));
  color:var(--gold-l);
  text-decoration:none;
  font-family:var(--font-mono);
  font-size:17px;
  letter-spacing:.4em;
  text-indent:.4em;
  box-shadow:
    inset 0 1px 0 rgba(255,240,220,.16),
    inset 0 -14px 24px -14px rgba(59,34,123,.9),
    0 8px 0 -1px rgba(59,34,123,.55),
    0 22px 46px -16px rgba(0,0,0,.9);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .22s ease,
             background .22s ease,color .22s ease,border-color .22s ease;
  overflow:hidden;
}
.key__tri{
  width:0;height:0;
  border-left:12px solid currentColor;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.key::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 18%,rgba(255,246,232,.22) 48%,transparent 78%);
  transform:translateX(-120%);
  transition:transform .65s cubic-bezier(.22,1,.36,1);
}
.key:hover{
  color:#0A0710;
  background:var(--gold-l);
  border-color:#FFF4E4;
}
.key:hover::after{transform:translateX(120%)}
.key:hover .key__tri{transform:translateX(4px)}
.key:active{
  transform:translateY(4px);
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.4),
    0 2px 0 -1px rgba(59,34,123,.55),
    0 8px 20px -12px rgba(0,0,0,.9);
}
.key:focus-visible{outline:2px solid var(--ice);outline-offset:5px}

.hint{
  margin:clamp(18px,4vw,24px) 0 0;
  font-size:10px;
  letter-spacing:.14em;
  color:rgba(244,237,230,.5);
}

/* ---------- 底部：关卡路线 ---------- */
.foot{position:relative;z-index:2}
.road{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  max-width:940px;
  margin:0 auto;
  padding:14px calc(var(--inset) + 12px) 12px;
  border-top:1px solid rgba(199,155,110,.14);
}
.road::before{
  content:"";
  position:absolute;
  left:calc(var(--inset) + 12px + 2px);
  right:calc(var(--inset) + 12px + 2px);
  top:21px;
  height:1px;
  background:repeating-linear-gradient(90deg,rgba(199,155,110,.45) 0 4px,transparent 4px 9px);
}
.road__i{
  position:relative;
  display:grid;
  grid-template-columns:auto 1fr;
  grid-template-rows:auto auto;
  column-gap:7px;
  row-gap:1px;
  align-items:center;
}
.road__dot{
  position:relative;
  z-index:2;
  grid-row:1;
  width:5px;height:5px;
  background:var(--gold);
  transform:rotate(45deg);
  box-shadow:0 0 9px rgba(199,155,110,.9);
}
.road__i:first-child .road__dot{background:var(--ice);box-shadow:0 0 10px rgba(159,211,236,.9)}
.road b{
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:400;
  letter-spacing:.1em;
  color:rgba(240,214,182,.95);
  line-height:1.4;
}
.road__l{
  grid-column:2;
  font-size:9.5px;
  letter-spacing:.04em;
  color:rgba(244,237,230,.5);
  line-height:1.4;
  white-space:nowrap;
}

/* ---------- 底栏 ---------- */
.bar--bottom{align-items:flex-end;padding-top:0}
.venue{font-size:10.5px;line-height:1.8;letter-spacing:.1em;color:rgba(244,237,230,.5)}
.venue b{display:block;font-weight:500;font-size:12.5px;letter-spacing:.1em;color:rgba(244,237,230,.88)}
.venue span{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.18em;color:rgba(141,122,168,.9)}
.slots{text-align:right;font-size:9px;letter-spacing:.16em;line-height:1.9;color:rgba(244,237,230,.42)}
.slots b{color:rgba(240,214,182,.9);font-weight:400}

/* ---------- 入场 ---------- */
.in{opacity:0;transform:translateY(10px);animation:bootIn .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes bootIn{to{opacity:1;transform:none}}
.i1{animation-delay:.05s}
.i2{animation-delay:.16s}
.i3{animation-delay:.30s}
.i4{animation-delay:.44s}
.i5{animation-delay:.56s}
.i6{animation-delay:.68s}

/* ---------- 适配 ---------- */
@media (min-width:768px){
  .bar{font-size:10.5px;letter-spacing:.22em}
  .marks__ts{height:32px}
  .marks__pgy{height:27px}
  .key{height:72px;font-size:18px;padding:0 38px 0 32px}
  .core__sub b{font-size:15px}
  .road b{font-size:11px}
  .road__l{font-size:10.5px}
}
@media (min-width:1100px){
  .logo{letter-spacing:.05em}
  .road{padding-top:18px;padding-bottom:16px}
  .road::before{top:26px}
  .core__sub{letter-spacing:.42em}
}
@media (max-height:600px) and (orientation:landscape){
  .logo{font-size:clamp(2.2rem,8.5vh,4.4rem)}
  .load{margin-top:10px}
  .key{height:52px;margin-top:14px;font-size:14px}
  .hint{display:none}
  .core__tag{margin-bottom:8px}
  .road{display:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .in{opacity:1;transform:none}
  .load__fill{transform:scaleX(1)}
  .scanlines{animation:none}
  .logo__slice{display:none}
}
</style>
</head>

<script>
/* 桌面端指针视差：仅在鼠标设备且未开启减弱动效时运行 */
(function(){
  var fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  var calm = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!fine || calm) return;
  var bg = document.querySelector('.wrap__bg');
  var tx=0, ty=0, cx=0, cy=0, raf=null;
  function loop(){
    cx += (tx-cx)*0.055;
    cy += (ty-cy)*0.055;
    bg.style.transform = 'scale(1.08) translate3d('+cx.toFixed(2)+'px,'+cy.toFixed(2)+'px,0)';
    raf = Math.abs(tx-cx)>0.1 || Math.abs(ty-cy)>0.1 ? requestAnimationFrame(loop) : null;
  }
  window.addEventListener('pointermove', function(e){
    tx = (e.clientX/window.innerWidth - .5) * -18;
    ty = (e.clientY/window.innerHeight - .5) * -12;
    if(!raf) raf = requestAnimationFrame(loop);
  }, {passive:true});
